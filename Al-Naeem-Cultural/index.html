ي، وبالأخص ممن لهم ارتباط مباشر أو غير مباشر بمنطقة النعيم، أو يمتلكون خبرات يمكن أن تسهم في بناء هذا المشروع وبلورة مكوناته."],["p","فالمشروع في هذه المرحلة لا يحتاج فقط إلى من يستمع إلى فكرته، بل إلى شخصيات تستطيع أن تضيف إليها من خبرتها وعلاقاتها ومعرفتها وحضورها المجتمعي، وأن تساعد في الانتقال بها من فكرة ثقافية وتراثية إلى مشروع مؤسسي قابل للتنفيذ."],["p","وتكتسب هذه الشخصيات أهميتها من تنوع مجالاتها؛ فبينها القيادات المجتمعية، والإعلاميون، والكتاب والباحثون، والفنانون، والقانونيون، والأكاديميون، وأصحاب الخبرات الاقتصادية والإدارية، والمهتمون بالسياحة والتراث، وأصحاب الصلة بتاريخ النعيم والبحر والغوص والحرف التقليدية."],["p","ومن هنا فإن اجتماع هذه الأسماء حول طاولة واحدة يعطي المشروع منذ بدايته رسالة واضحة مفادها أن مركز النعيم الثقافي والتراثي مشروع مجتمعي تشارك في صياغته الخبرات والكفاءات وأبناء المنطقة، وليس مشروعاً فردياً أو فكرة معزولة عن محيطها."],["h","أولا: القيادات المؤسسية والمجتمعية"],["h","الأستاذ غازي عبدالمحسن جاسم علي"],["p","رئيس مركز تمكين شباب النعيم، ومدرب معتمد في الإعلام والعلاقات العامة، وله خبرة في التدريب والعمل الإعلامي والأنظمة الصوتية، إلى جانب حضوره في العمل الأهلي والتطوعي."],["lbl","الدور المقترح في المشروع:"],["p","يمثل وجوده البعد المؤسسي للمشروع، باعتبار مركز تمكين شباب النعيم الحاضن المقترح للمبادرة. ويمكن لخبرته في الإعلام والعلاقات العامة أن تسهم في بناء هوية المشروع، وإدارة التواصل معه، وفتح قنوات التعريف به واستقطاب الكفاءات والشركاء."],["lbl","أثر حضوره:"],["p","إعطاء المشروع مظلة مؤسسية واضحة منذ بدايته، وربط المشروع برسالة المركز في تمكين الشباب وخدمة المجتمع."],["h","الأستاذ كامل جعفر آل رضي"],["p","نائب رئيس مركز تمكين شباب النعيم."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في الجانب الإداري والتنظيمي، ومتابعة التنسيق بين المشروع ومجلس إدارة المركز، والمساعدة في تحويل مخرجات اللقاءات إلى خطوات عملية قابلة للمتابعة."],["lbl","أثر حضوره:"],["p","تعزيز الجانب المؤسسي للمشروع، وإظهار أن المبادرة تحظى باهتمام قيادة المركز منذ مرحلة التأسيس."],["h","الأستاذ أحمد عبدالكريم مكي عيسى الكوفي"],["p","رئيس مجلس إدارة جمعية النعيم الخيرية."],["lbl","الدور المقترح في المشروع:"],["p","ربط المشروع بالعمل الأهلي والاجتماعي في المنطقة، والاستفادة من خبرة الجمعية وشبكة علاقاتها المجتمعية، وما يمكن أن توفره من دعم للتواصل مع الأسر والشخصيات والمهتمين بتاريخ النعيم."],["lbl","أثر حضوره:"],["p","توسيع قاعدة المشروع من مركز الشباب إلى منظومة العمل الأهلي في النعيم، وإعطاء المشروع بعدا مجتمعيا أوسع."],["h","الأستاذ مهدي حسن علي الكليتي"],["p","نائب رئيس جمعية النعيم الخيرية، وله حضور مهني ومجتمعي وخبرة في العمل الصحي والخيري."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في الجانب المجتمعي والتنظيمي، وربط المشروع بالمبادرات والطاقات التطوعية في المنطقة، ودعم التنسيق بين المؤسسات الأهلية والمجتمعية."],["lbl","أثر حضوره:"],["p","تعزيز فكرة أن المركز المقترح يمكن أن يكون منصة جامعة للطاقات والخبرات الموجودة في النعيم."],["h","الأستاذ صادق أحمد رحمة"],["p","شخصية وطنية واجتماعية بارزة، عُرف بدوره في العمل البلدي والخيري المرتبط بمنطقة النعيم والعاصمة المنامة، ومتابعته المستمرة للقضايا الخدمية وتطوير البنية التحتية فيها. كما شغل منصب رئيس سابق لجمعية النعيم الخيرية، وله حضور واسع في الفعاليات والمناسبات الاجتماعية والدينية، ومساهمات في توثيق تاريخ العمل الخيري والاجتماعي بالمنطقة."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في توثيق تاريخ العمل الأهلي والخيري في النعيم، والاستفادة من خبرته في متابعة قضايا المنطقة وعلاقاتها المجتمعية، وربط المشروع بالشخصيات والمؤسسات التي أسهمت في خدمة المجتمع."],["lbl","أثر حضوره:"],["p","تعزيز البعد التاريخي والاجتماعي للمشروع، وإبراز تطور العمل الأهلي والخيري باعتباره جزءا من ذاكرة النعيم وهويتها المجتمعية."],["h","الأستاذ عبدالواحد الإسكافي"],["p","رئيس لجنة الحكام في اتحاد كرة اليد، وأحد رواد مركز تمكين شباب النعيم الذين أسهموا في قيام المركز من خلال جهودهم وحضورهم."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في استحضار ذاكرة تأسيس مركز تمكين شباب النعيم، وتوثيق جهود الرواد والمراحل الأولى للعمل الشبابي والرياضي، إلى جانب دعم المبادرات التي تربط الرياضة بالشباب والعمل المجتمعي."],["lbl","أثر حضوره:"],["p","ربط مشروع المركز الثقافي والتراثي بتاريخ الحركة الشبابية في النعيم، وحفظ جهود الرواد الذين أسهموا في بناء المؤسسات والمبادرات المجتمعية."],["h","ثانيا: الخبرات الحكومية والإدارية والقانونية"],["h","الأستاذ حميد يوسف رحمه"],["p","وكيل مساعد سابق للتجارة المحلية بوزارة الصناعة والتجارة والسياحة، ورئيس جمعية النعيم الخيرية سابقاً،"],["lbl","الدور المقترح في المشروع:"],["p","الاستفادة من خبرته الحكومية والإدارية في فهم آليات التعامل مع الجهات الرسمية والقطاع الخاص، ودراسة الجوانب المتعلقة بالشراكات والاستثمار والاستدامة الاقتصادية للمشروع."],["lbl","أثر حضوره:"],["p","إضافة بعد إداري واقتصادي للمشروع، وعدم حصره في الجانب الثقافي والتراثي فقط."],["h","المحامي جعفر عبدالامير الشيخ"],["p","محام بحريني ومحكم تجاري، وله حضور في العمل المجتمعي والأهلي، أمين سر جمعية النعيم الخيرية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الأطر القانونية والتنظيمية للمشروع، وطبيعة الشراكات والاتفاقيات، وآليات حفظ حقوق المشروع ومقتنياته ووثائقه، وما يرتبط بالملكية الفكرية والتبرعات والمساهمات."],["lbl","أثر حضوره:"],["p","توفير رؤية قانونية مبكرة تساعد على تأسيس المشروع بطريقة مؤسسية سليمة."],["h","سلمان سالم سليم"],["p","برلماني بحريني سابق وعضو سابق في مجلس النواب بمملكة البحرين، وعُرف بكتابة المقالات والتحليلات السياسية والاجتماعية في الصحافة البحرينية، إلى جانب حضوره الاجتماعي والثقافي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الجوانب المجتمعية والمؤسسية للمشروع، والاستفادة من خبرته العامة في قراءة القضايا الاجتماعية والتواصل مع مختلف فئات المجتمع، إلى جانب دعم الجانب التوثيقي والتحليلي للمبادرة."],["lbl","أثر حضوره:"],["p","إضافة رؤية اجتماعية ووطنية للمشروع، وربط المركز بالقضايا المرتبطة بتطور المجتمع والذاكرة العامة والتحولات التي مرت بها المنطقة."],["h","ثالثا: الشخصيات المرتبطة بالتراث والذاكرة المحلية"],["h","الأستاذ جمال صالح دهنيم"],["p","رئيس لجنة المشاريع بجمعية النعيم الخيرية، وله ارتباط طويل بالعمل الاجتماعي والثقافي والخيري في المنطقة، كما يرتبط تاريخ عائلته بالبحر وتجارة اللؤلؤ والغوص، وله اهتمام واضح بالتراث والأعمال الفنية والتراثية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في استحضار الذاكرة الاجتماعية والتراثية للنعيم، وربط المشروع بالأسر والقصص والمقتنيات والصور واللوحات والمواد التراثية الموجودة لدى الأهالي."],["lbl","أثر حضوره:"],["p","تعزيز الجانب المحلي للمشروع، بحيث لا يكون التراث مادة نظرية، بل ذاكرة حية مرتبطة بأهل النعيم وتاريخهم."],["h","الأستاذ الدكتور يوسف أحمد بن ماجد النشابة"],["p","باحث وكاتب في التراث، وله اهتمام خاص بصناعة السفن في البحرين وما يرتبط بها من معتقدات شعبية وقصص وروايات، وبثقافة القلافين ولغتهم الخاصة."],["lbl","الدور المقترح في المشروع:"],["p","الإسهام في تأسيس محور البحر وصناعة السفن والقلافة والغوص، وتحديد ما ينبغي توثيقه من المصطلحات والحكايات والأدوات والمهن والشخصيات والممارسات المرتبطة بهذا التراث."],["lbl","أثر حضوره:"],["p","إعطاء المشروع عمقا تراثيا متخصصا، وتحويل الذاكرة البحرية من مجرد صور ومقتنيات إلى مادة معرفية موثقة."],["h","الأستاذ سعيد إبراهيم القلاف"],["p","كاتب وباحث تراثي بحريني، ومؤلف كتاب (دروازة النعيم و ليوان النعيم) الذي يوثق تاريخ منطقة النعيم في البحرين."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في توثيق تاريخ النعيم ومراحل تطورها، والاستفادة من تجربته الكتابية والبحثية في جمع المعلومات والروايات والصور والوثائق، وتحويلها إلى مواد معرفية يمكن عرضها ونشرها ضمن برامج المركز."],["lbl","أثر حضوره:"],["p","إضافة مصدر معرفي مهم لتوثيق تاريخ النعيم، وربط المشروع بالمؤلفات والجهود السابقة التي تناولت تاريخ المنطقة وذاكرتها المحلية."],["h","الأستاذ علي سلطان السلاطنة"],["p","شاعر شعبي بحريني من منطقة النعيم، وله إنتاج في المجالات الدينية والاجتماعية والوطنية والتراثية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في توثيق الشعر الشعبي واللغة المحلية والموروث الشفهي، وجمع القصائد والروايات والتعبيرات التي تعكس وجدان المجتمع وذاكرته الاجتماعية والثقافية."],["lbl","أثر حضوره:"],["p","إبراز الشعر واللغة الشعبية باعتبارهما جزءا أصيلا من التراث غير المادي للنعيم، وإتاحة المجال لتقديم الذاكرة المحلية بأسلوب أدبي وفني."],["h","رابعا: الثقافة والسياحة والتعريف بالتراث البحريني"],["h","الأستاذ ميرزا النشيط"],["p","من الشخصيات المرتبطة بمجالي السياحة والثقافة، وله حضور في مجال الإرشاد السياحي والعمل المرتبط بالتعريف بالتراث البحريني."],["lbl","الدور المقترح في المشروع:"],["p","دراسة كيفية تقديم مركز النعيم الثقافي والتراثي كوجهة ثقافية وسياحية، وربطه بالمسارات السياحية والتراثية في مملكة البحرين، والاستفادة من خبرته في بناء المحتوى الذي يخاطب الزائر والسائح."],["lbl","أثر حضوره:"],["p","نقل المشروع من نطاق الذاكرة المحلية إلى إمكانية أن يصبح نقطة جذب ثقافية وتراثية ضمن المشهد السياحي في البحرين."],["h","الإعلامي الرحالة محمود النشيط"],["p","له اهتمام بالإعلام والسياحة والدراسات السياحية، وله تجربة في الصحافة السياحية المتخصصة."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في وضع تصور إعلامي وسياحي للمركز، وكيفية تحويل محتواه إلى قصص ومواد إعلامية تصل إلى الجمهور البحريني والزائر، إضافة إلى التفكير في البرامج والرحلات والمسارات التي يمكن أن ترتبط بالمركز."],["lbl","أثر حضوره:"],["p","تعزيز قابلية المشروع للظهور إعلاميا وتحويله إلى تجربة يمكن التعريف بها محليا وخارجيا."],["h","خامسا: الكتاب والباحثون والرواة"],["h","الأستاذ الكاتب جمعة السترواي"],["p","كاتب وداعم للمشاريع والمبادرات المجتمعية، وله حضور في العمل الخيري والاجتماعي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في الجانب الثقافي والكتابي للمشروع، وتطوير المبادرات والبرامج التي تجعل المركز مساحة للحوار والكتابة والتوثيق والنشر."],["lbl","أثر حضوره:"],["p","تعزيز البعد الثقافي والفكري للمركز وربطه بالحركة المجتمعية."],["h","الدكتورة غنية عليوي"],["p","أكاديمية وباحثة وكاتبة وناشطة اجتماعية."],["lbl","الدور المقترح في المشروع:"],["p","الإسهام في الجانب البحثي والمعرفي، ووضع منهجية للتوثيق والدراسات والبحوث التي يمكن أن ينتجها المركز، وربط التراث بالمجتمع والتعليم والمعرفة."],["lbl","أثر حضورها:"],["p","إضافة البعد الأكاديمي والبحثي للمشروع، بما يساعد على تأسيس مركز لا يكتفي بعرض التراث، وإنما ينتج المعرفة حوله."],["h","الأستاذ محمود عبدالصاحب البقلاوة"],["p","باحث ومؤرخ وفنان، وله اهتمام بالإرث البحريني والحضارة الدلمونية وتوظيف عناصرها في الأعمال الفنية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في الربط بين التاريخ والآثار والرموز الحضارية والفن، وتقديم رؤية حول كيفية عرض الموروث البحريني والدلموني بصورة معاصرة."],["lbl","أثر حضوره:"],["p","إضافة عمق حضاري وفني للمشروع، وربط النعيم بتاريخ البحرين الأوسع."],["h","المهندس عبدالله حسن عمران"],["p","مهندس وباحث بحريني مهتم بتوثيق التراث والمهن الشعبية، ومن أبرز أعماله كتاب «المهن الشعبية في البحرين – سوق الحدادة أنموذجاً»، الذي يوثق تاريخ سوق الحدادة وفريق الحدادين."],["h","دوره المحتمل: ا"],["p","لإسهام في توثيق المهن والحرف التقليدية المرتبطة بالنعيم، وإثراء الجانب البحثي والتراثي للمركز."],["lbl","أثر حضوره:"],["p","تعزيز البعد التوثيقي والعلمي للمشروع وربط المهن الشعبية بالذاكرة الاجتماعية للمنطقة."],["h","الدكتورة جميلة يوسف الوطني"],["p","حاصلة على الدكتوراه في القانون، ومستشارة وخبيرة قانونية في البيئة، إلى جانب اهتمامها بالشعر والكتابة والرواية."],["lbl","الدور المقترح في المشروع:"],["p","الإسهام في الجمع بين البعد القانوني والثقافي والبيئي والكتابي، ودراسة فرص توظيف هذه الجوانب في برامج المركز ومحتواه."],["lbl","أثر حضورها:"],["p","إضافة شخصية متعددة الخبرات قادرة على النظر إلى المشروع من أكثر من زاوية، وربط التراث بالقضايا القانونية والبيئية والثقافية."],["h","الأستاذ محمد الأحمدي"],["p","رئيس مركز البحرين للمستثمرين، ومستشار بمكتب الوكيل المساعد للتجارة المحلية، وكاتب قصص وروايات وموضوعات اجتماعية، ومستشار في التنمية البشرية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الجوانب الإدارية والاستثمارية، وفتح قنوات التواصل مع الجهات الاقتصادية، إلى جانب دعم المحتوى الاجتماعي والكتابي وبرامج تنمية القدرات البشرية."],["lbl","أثر حضوره:"],["p","الجمع بين الخبرة الإدارية والاقتصادية والاهتمام الثقافي والإنساني، بما يدعم بناء مشروع قادر على استثمار الطاقات وتطوير موارده وشراكاته."],["h","سادسا: الفن والتشكيل والحرف"],["h","الاستاذ الفنان عباس الموسوي"],["p","فنان معروف بأعماله الفنية التي تتناول الطبيعة والسلام والبيئة البحرينية، وله مبادرات اجتماعية ومجتمعية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في بناء الهوية البصرية والفنية للمركز، واقتراح المعارض والأعمال الفنية التي يمكن أن تربط الفن بالبيئة والذاكرة البحرينية."],["lbl","أثر حضوره:"],["p","رفع القيمة الفنية والجمالية للمشروع، وفتح المجال أمام الفن ليكون جزءا من طريقة تقديم التراث، وليس مجرد عنصر تجميلي."],["h","الأستاذ الفنان والخزاف محسن التيتون"],["p","من المهتمين بفن الخزف، وله تجربة في المعارض والندوات، وارتبط اسمه بتشجيع انتشار الخزف في المجتمع."],["lbl","الدور المقترح في المشروع:"],["p","تأسيس تصور لمحور الحرف والفنون التطبيقية، وخاصة الخزف، وطرح فكرة الورش والمعارض والتعليم الحرفي وربط الحرفة بالاقتصاد الإبداعي."],["lbl","أثر حضوره:"],["p","إدخال الحرفة من كونها مادة للعرض إلى كونها مهارة حية يمكن تعليمها وإنتاجها وتطويرها وتسويقها."],["h","سابعا: الإدارة والاقتصاد والاستثمار"],["h","الأستاذ أحمد صالح النعيمي"],["p","رئيس تنفيذي ورجل أعمال، وله تجربة في تأسيس الشركات والاستشارات والاستثمار، إلى جانب حضور اجتماعي وثقافي في النعيم، وعضو في مجلس الأوقاف الجعفرية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الاستدامة المالية للمشروع، ونماذج الشراكة مع القطاع الخاص، وفرص الاستثمار في الأنشطة الثقافية والحرفية والسياحية، بما يساعد المركز على بناء نموذج قابل للاستمرار."],["lbl","أثر حضوره:"],["p","إضافة البعد الاقتصادي والاستثماري، والتأكيد على أن المشروع يحتاج منذ البداية إلى التفكير في استدامته وليس فقط في تأسيسه."],["h","الأستاذ علي إبراهيم النشابة"],["p","محاسب قانوني، وصاحب كتاب (استثمار قدرات الإنسان البحريني الإبداعية) وله مساهمات في العمل المجتمعي والتطوعي وحضور ثقافي واجتماعي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الجانب الإداري والمالي والاستدامة، وربط المشروع بفكرة استثمار الطاقات البشرية والإبداعية، وهي من أهم مرتكزات المركز المقترح."],["lbl","أثر حضوره:"],["p","تعزيز فكرة أن المركز يمكن أن يكون منصة لاكتشاف القدرات وتنميتها واستثمارها، وليس مجرد مكان لحفظ الماضي."],["h","الدكتور حسن عبدالعزيز الماضي"],["p","خبير مالي واكتواري وعضو سابق في مجلس إدارة التأمينات الاجتماعية، إلى جانب حضوره الاجتماعي والثقافي في النعيم."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة النماذج المالية والإدارية، وبحث آليات الاستدامة والتمويل والشراكات، وتقديم المشورة المتعلقة بالتخطيط المالي وإدارة الموارد."],["lbl","أثر حضوره:"],["p","تعزيز الجانب المالي والاستراتيجي للمشروع، والمساعدة في بناء تصور واقعي لاستدامته واستمراريته على المدى البعيد."],["h","الأستاذ الوجيه عبدالصمد النشابة"],["p","محاسب ومصرفي في مجال البنوك والبورصة، ومؤسس (شركة صبايا) المتخصصة بتزويد البحرين والدول المجاورة بمعدات التجميل بأنواعها، إلى جانب حضوره الاجتماعي والثقافي، ويشغل منصب الأمين العام لجمعية التجمع القومي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الجوانب الاقتصادية والاستثمارية، والاستفادة من خبرته في الإدارة والتجارة والعلاقات المؤسسية، إلى جانب دعم التواصل مع أصحاب الأعمال والقطاع الخاص."],["lbl","أثر حضوره:"],["p","إضافة خبرة اقتصادية وتجارية للمشروع، وفتح المجال أمام دراسة فرص الشراكة والاستثمار التي يمكن أن تدعم البرامج الثقافية والحرفية والتراثية."],["h","ثامنا: الإعلام والعلاقات العامة"],["h","الأستاذ علي إبراهيم السلاطنة"],["p","حاصل على درجة الماجستير في الإعلام والعلاقات العامة، وله إسهامات في العمل التطوعي في النعيم."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في إعداد استراتيجية الاتصال والإعلام للمشروع، وبناء المحتوى الإعلامي، وتوثيق مراحل التأسيس، وإدارة التواصل مع المجتمع والجهات المختلفة."],["lbl","أثر حضوره:"],["p","توفير عنصر إعلامي متخصص يساعد على إيصال المشروع إلى الجمهور، وتحويل خطواته إلى قصة مجتمعية يتفاعل معها الناس."],["h","الأستاذ جعفر حميد النشيط"],["p","من أبناء منطقة النعيم، وله حضور ومساهمات في العمل الاجتماعي والثقافي والقرآني والتطوعي، مع اهتمام واضح بتطوير العمل المؤسسي والإعلام المجتمعي والاستفادة من التقنية في خدمة المبادرات والأعمال المجتمعية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في الجوانب التنظيمية والإعلامية والرقمية للمشروع، وتوثيق المعلومات والبيانات المتعلقة بتراث النعيم وشخصياتها ومبادراتها، إلى جانب تطوير الأنظمة والوسائل الرقمية التي تساعد في جمع المحتوى التراثي وحفظه وتصنيفه وإتاحته، والمساهمة في التواصل الإعلامي والتعريف بالمشروع ومراحله وفعالياته."],["lbl","أثر حضوره:"],["p","الجمع بين الخبرة في العمل المجتمعي والتنظيم والإعلام والتقنية، بما يعزز قدرة المشروع على توثيق التراث بصورة منهجية، وتحويل المادة التاريخية والاجتماعية إلى محتوى منظم وقابل للحفظ والنشر والاستفادة منه مستقبلاً، مع دعم استدامة المشروع وتوسيع دائرة المشاركة المجتمعية فيه."],["h","الكابتن عباس جاسم السلاطنة"],["p","من الشخصيات الرياضية البارزة من أبناء منطقة النعيم، ومن الأسماء التي ارتبطت بتاريخ لعبة كرة اليد في المنطقة والبحرين لعقود طويلة. مارس اللعبة لاعباً مع منتخب البحرين وفريق نادي النعيم، ثم انتقل إلى مجال التدريب والعمل الفني والإداري، وأسهم بصورة واضحة في استقطاب الناشئين وتدريبهم وتنمية مهاراتهم وصقل مواهبهم وإعداد جيل جديد من لاعبي كرة اليد."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في توثيق تاريخ الحركة الرياضية في النعيم، وبالأخص مسيرة كرة اليد ولاعبيها ومدربيها وشخصياتها البارزة، وجمع الروايات والصور والوثائق والذكريات الرياضية، والمساعدة في التعريف بالأجيال التي أسهمت في تأسيس الحركة الرياضية وتطويرها، بما يحفظ هذا الجانب من تاريخ المنطقة للأجيال القادمة."],["lbl","أثر حضوره:"],["p","يمثل حضور الكابتن عباس السلاطنة امتداداً حياً لذاكرة الرياضة في النعيم، والاستفادة من تجربته الطويلة وخبرته الميدانية تسهم في توثيق مرحلة مهمة من تاريخ شباب المنطقة وإنجازاتهم الرياضية، وإبراز قصص اللاعبين والمدربين الذين أسهموا في صناعة الحركة الرياضية وبناء الأجيال، بما يعزز صورة النعيم بوصفها بيئة أنتجت شخصيات رياضية كان لها حضور وعطاء مستمر على مدى عقود."],["h","تاسعا: القيادات المجتمعية والتطوعية في ظل الدراسات النفسية"],["h","الدكتور فاضل جاسم النشيط"],["p","استشاري في الطب النفسي، ورئيس اللجنة العليا المنظمة لحملة التبرع بالدم، ويُعرف بحضوره البارز في العمل التطوعي والمجتمعي، حيث سبق أن اشتهر بعطائه ومشاركته في خدمة المجتمع قبل أن يُعرف بصفته المهنية كاستشاري في الطب النفسي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في بناء الجانب المجتمعي والتطوعي للمركز، والاستفادة من خبرته في تنظيم المبادرات واستقطاب المتطوعين وتشكيل فرق العمل وإدارة الفعاليات المجتمعية. كما يمكن الاستفادة من رؤيته في تصميم برامج تستقطب مختلف فئات المجتمع، وخاصة الشباب، وتجعل المركز مساحة للمشاركة والعطاء وليس مجرد موقع لحفظ التراث."],["lbl","أثر حضوره:"],["p","تعزيز البعد الإنساني والتطوعي للمشروع، وترسيخ فكرة أن المركز مساحة لتنمية الإنسان وخدمة المجتمع إلى جانب حفظ الذاكرة والتراث."],["h","عاشرا: الشخصيات المجتمعية والتطوعية"],["h","الوجيه عبدالنبي أحمد الماي"],["p","وجيه ورجل أعمال بحريني من أبناء منطقة النعيم، وله حضور اجتماعي وتجاري معروف، إلى جانب مساهماته في دعم عدد من الفعاليات واللجان والمبادرات الخيرية والثقافية في المنطقة والمناطق المجاورة، بما يعكس ارتباطه بالمجتمع واهتمامه بالمبادرات ذات الأثر العام."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دعم المشروع من خلال الخبرة التجارية والاجتماعية، وفتح مجالات للتواصل مع رجال الأعمال والمؤسسات الاقتصادية، والمساندة في توفير أوجه الدعم والرعاية والشراكات التي يحتاجها المشروع، إلى جانب الإسهام في تعزيز ارتباط المشروع بالمجتمع المحلي وأهالي النعيم."],["lbl","أثر حضوره:"],["p","الاستفادة من مكانته الاجتماعية وخبرته التجارية وعلاقاته المجتمعية في تعزيز حضور المشروع واستدامته، وربط الجانب التراثي والثقافي بالقطاع الأهلي والتجاري، بما يفتح المجال أمام شراكات ودعم مستمر يساعد على تحويل المشروع من فكرة توثيقية إلى معلم تراثي وثقافي يحظى بمشاركة المجتمع وأبنائه."],["h","الوجيه حسين العلي (أبو بسام)"],["p","من الشخصيات الاجتماعية البارزة، ويُعرف بوجاهته ومجلسه المفتوح الذي يمثل ملتقى للشخصيات الاجتماعية والأهلية، ومساحة للتواصل وتبادل الآراء والخبرات."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في تعزيز التواصل المجتمعي، وفتح المجال أمام الوصول إلى الشخصيات والأسر والأهالي ممن يمتلكون ذكريات أو وثائق أو مقتنيات مرتبطة بتاريخ النعيم، إلى جانب دعم اللقاءات المجتمعية المرتبطة بالمشروع."],["lbl","أثر حضوره:"],["p","تعزيز الثقة المجتمعية بالمشروع، وربطه بالمجالس والروابط الاجتماعية التي تمثل جزءا من الذاكرة الحية للمنطقة."],["h","الأستاذة حنان حماد"],["p","ناشطة بحرينية بارزة ومؤسسة مبادرة Dream Big، ولها حضور في الأوساط الشبابية واهتمام بدعم الطاقات والمبادرات المجتمعية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في بناء البرامج الشبابية والتطوعية، واستقطاب الطاقات الشابة، وتطوير مبادرات تربط التراث بالابتكار والإبداع والعمل المجتمعي، والاستفادة من خبرتها في دعم المبادرات وتحفيز المشاركين."],["lbl","أثر حضورها:"],["p","إضفاء بعد شبابي وتطوعي على المشروع، والمساعدة في تحويل المركز إلى مساحة تفاعلية تستقطب الشباب وتمنحهم دورا في حفظ التراث وتطويره."],["h","الأستاذة زينب الزاير"],["p","شخصية فاعلة في تنظيم أنشطة وفعاليات جمعية النعيم الخيرية، وتشارك في تنسيق الفعاليات المجتمعية، ومنها بازارات الأسر المنتجة والأنشطة الشبابية والخيرية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في تنظيم الفعاليات والمعارض والبرامج المجتمعية، وربط المشروع بالأسر المنتجة وأصحاب المهارات والمبادرات المحلية، مع دعم مشاركة المرأة والشباب في أنشطة المركز."],["lbl","أثر حضورها:"],["p","تعزيز الجانب التنفيذي والمجتمعي للمشروع، وتحويل المركز إلى منصة تستوعب المبادرات والمنتجات والطاقات المحلية."],["h","الأستاذة حوراء حبيب آل نوح"],["p","ناشطة اجتماعية وتربوية، ولها حضور محلي في منطقة النعيم من خلال الإشراف والمشاركة في تنظيم حفلات تكريم الطالبات المتفوقات، وتقديم الكلمات التحفيزية ودعم المسيرة التعليمية."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في إعداد البرامج التعليمية والتربوية، وربط المشروع بالمدارس والطلبة والمتفوقين، واقتراح مبادرات تحفز الأجيال الجديدة على التعرف إلى تاريخ المنطقة وتراثها والمشاركة في توثيقه."],["lbl","أثر حضورها:"],["p","ربط المشروع بالجانب التعليمي والتربوي، وتعزيز انتقال المعرفة بالتراث من جيل إلى آخر بأسلوب محفز وتفاعلي."],["h","الأستاذ محمد أحمد النشابة"],["p","يتمتع الأستاذ محمد أحمد النشابة بخلفية أكاديمية في العمل الاجتماعي، إلى جانب حضور مجتمعي وتطوعي فاعل، ومشاركة في الأنشطة والفعاليات التي تنظمها مؤسسات العمل الخيري والاجتماعي."],["p","كما أسهم في فعاليات وبرامج اجتماعية ومعارض، واهتم بالمبادرات الداعمة للأسر وتعزيز التواصل المجتمعي، إضافة إلى حضوره في الندوات واللقاءات الاجتماعية والتاريخية المرتبطة بتاريخ المنطقة وأهلها."],["lbl","الدور المقترح في المشروع:"],["p","يمكن أن يسهم الأستاذ محمد أحمد النشابة في الجانب المجتمعي والإنساني والتوثيقي للمشروع، مستفيدًا من خلفيته في العمل الاجتماعي والتطوعي ومشاركته في الفعاليات والندوات."],["p","كما يمكن أن يشارك في التواصل مع الأسر وأفراد المجتمع، ورصد الذاكرة الاجتماعية، وتشجيع جمع القصص والصور والوثائق والمعلومات التي تسهم في بناء محتوى المركز."],["lbl","أثر حضوره:"],["p","يمثل حضور الأستاذ محمد أحمد النشابة إضافة للجانب الاجتماعي والإنساني للمشروع، ويسهم في ربط المركز بالمجتمع، بحيث يمتد توثيق تراث النعيم إلى الإنسان وذكرياته وتجربته الاجتماعية بوصفها جزءًا أصيلًا من ذاكرة المنطقة."],["h","أحمد مهدي السكري"],["p","عضو اللجنة العليا المنظمة لحملة التبرع بالدم، وداعم للمبادرات المجتمعية والخيرية."],["lbl","الدور المقترح في المشروع:"],["p","خبرة في العمل المجتمعي والإدارة والتنسيق المؤسسي، وفتح قنوات تعاون وشراكات تخدم برامج المركز."],["lbl","أثر حضوره:"],["p","يعزز حضورُه البعد المؤسسي والمجتمعي للمشروع، ويفتح المجال أمام الاستفادة من خبراته وعلاقاته في تنظيم المبادرات وبناء الشراكات."],["h","سعيد أحمد مرهون"],["p","رئيس مجلس أمناء جمعية النعيم الخيرية سابقاً، وفاعل في العمل الأهلي والمجتمعي."],["lbl","الدور المقترح في المشروع:"],["p","خبرة في العمل الخيري والمؤسسي، ومعرفة باحتياجات المجتمع، والمساهمة في إشراك مختلف الفئات في المشروع وبرامجه."],["lbl","أثر حضوره:"],["p","يعزز حضورُه البعد الأهلي والمجتمعي للمشروع، ويدعم ارتباط المركز بالمؤسسات الخيرية والفعاليات المجتمعية واحتياجات أهالي النعيم."],["h","سامي نوح «أبو أحمد»"],["p","من الكوادر المجتمعية والإدارية في النعيم، وذو خبرة في العمل الأهلي والتواصل المجتمعي."],["lbl","الدور المقترح في المشروع:"],["p","يمثل حضوره خبرة مهمة في التواصل مع كبار السن والرعيل الأول وتوثيق الذاكرة الشفوية، إلى جانب خبرته الإدارية في العمل الأهلي. ويمكن الاستفادة منه في جمع الروايات والصور والمعلومات المرتبطة بتاريخ النعيم وشخصياتها."],["lbl","أثر حضوره:"],["p","يعزز حضورُه جانب الذاكرة الشفوية والتوثيق المحلي، من خلال خبرته في التواصل مع كبار السن والرعيل الأول ومعرفته بشخصيات وأحداث من تاريخ النعيم."],["h","الأستاذة زينب المرخي"],["p","شخصية مجتمعية وتطوعية، ترتبط بالأنشطة والفعاليات الخاصة بمؤسسات العمل الخيري والاجتماعي في منطقة النعيم، وبالأخص الفعاليات النسوية والبرامج المشتركة والمعارض ودعم الأسر وتطوير المهارات."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في إعداد وتنظيم البرامج النسوية والاجتماعية، واستقطاب المشاركات والمتطوعات، ودعم المعارض والورش والفعاليات التي تسهم في إبراز مهارات المجتمع وطاقاته."],["lbl","أثر حضورها:"],["p","توسيع دائرة المشاركة المجتمعية في المشروع، وإبراز دور المرأة في التوثيق والعمل التطوعي وتنمية المهارات والحفاظ على الموروث الاجتماعي."],["h","الحادي عشر: التخطيط العمراني والهندسة والتصميم"],["h","المهندس رضا محمد الأدرج"],["p","يشغل حاليا منصب نائب الرئيس التنفيذي للتطوير والمشاريع في شركة بوابة دلمون العقارية. وسبق أن شغل منصب الوكيل المساعد للمشاريع الإسكانية بوزارة الإسكان والتخطيط العمراني، حيث ارتبط عمله بالإشراف على المشاريع الإسكانية وتطوير الشراكات مع القطاع الخاص وبرامج السكن الاجتماعي، مثل (برنامج مزايا) ."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في دراسة الاحتياجات العمرانية والمكانية للمركز، وتقديم الرأي في اختيار الموقع وتطوير الشراكات، والاستفادة من خبرته في إدارة المشاريع والتخطيط والتعاون بين القطاعين العام والخاص."],["lbl","أثر حضوره:"],["p","إضافة خبرة متخصصة في التخطيط والتطوير وإدارة المشاريع، بما يساعد على الانتقال من الرؤية العامة إلى تصور مكاني وتنفيذي قابل للدراسة."],["h","المهندس محمد عبدالصمد النشابة"],["p","المدير العام لشركة بلوزون للهندسة والتصميم الداخلي والإنشاءات وتجديد المباني، وله خبرة في التصميم والعمارة وتنفيذ المشاريع وتطوير الواجهات وتحويل المساحات القائمة إلى بيئات جديدة ذات طابع جمالي ووظيفي."],["lbl","الدور المقترح في المشروع:"],["p","المساهمة في وضع التصور العمراني والتصميمي للمركز، ودراسة كيفية توظيف العمارة والتصميم الداخلي في عرض التراث، مع بحث إمكانات إعادة تأهيل المباني أو المساحات وتحويلها إلى بيئات ثقافية وتراثية."],["lbl","أثر حضوره:"],["p","ربط المحتوى التراثي بالتصميم والهوية المعمارية، والمساعدة في بناء مكان يجمع بين الوظيفة الثقافية والقيمة الجمالية والهوية المحلية."],["h","القيمة المشتركة لاجتماع هذه الشخصيات"],["lbl","إن اجتماع هذه الكفاءات في لقاء تأسيسي واحد يحقق للمشروع قيمة تتجاوز مجموع الأسماء نفسها؛ لأنه يجمع في مكان واحد:"],["p","المؤسسة، العمل الأهلي، التراث، التاريخ، البحث، السياحة، الإعلام، القانون، الفن، الحرف، الاقتصاد، الشباب، الذاكرة المحلية."],["p","وهذا التنوع هو ما يحتاج إليه المشروع في مرحلته التأسيسية؛ فكل شخصية تستطيع أن تضيف جزءا من الصورة، بينما يؤدي الحوار المشترك إلى تكوين الصورة الكاملة."],["lbl","كما أن حضور هذه الشخصيات يمكن أن يفتح للمشروع مجموعة من المسارات العملية، منها:"],["li","الوصول إلى أصحاب المقتنيات والصور والوثائق والروايات القديمة."],["li","التعرف على الخبرات المتخصصة التي يمكن أن تشارك في اللجان وفرق العمل."],["li","فتح قنوات التواصل مع الجهات الرسمية والمؤسسات الثقافية والسياحية."],["li","بناء شراكات مع القطاع الأهلي والخاص."],["li","استقطاب الفنانين والحرفيين والباحثين والشباب."],["li","تحديد البرامج التي يمكن أن يبدأ بها المركز قبل إنشاء مقره الدائم."],["li","وضع تصور واقعي للهوية والمحتوى والاحتياجات."],["li","تحويل المشروع من فكرة إلى شبكة من أصحاب العلاقة القادرين على المساهمة في تنفيذه."],["h","حضورهم رسالة بحد ذاته"],["p","ولذلك فإن أهمية اللقاء لا تكمن فقط في ما سيقال خلال الاجتماع، وإنما في من سيجلس حول الطاولة."],["p","فحين يجتمع رئيس مركز تمكين شباب النعيم مع رئيس جمعية النعيم الخيرية، وأصحاب الخبرة الحكومية والقانونية والاقتصادية، والباحثين والكتاب، وأهل البحر والتراث، والفنانين والخزافين، والإعلاميين، والمهتمين بالسياحة، والشخصيات المرتبطة بالذاكرة المحلية؛ فإن ذلك يعطي المشروع منذ لحظته الأولى صورة مختلفة."],["p","إنها صورة تقول إن مركز النعيم الثقافي والتراثي ليس مشروع فئة واحدة، ولا مشروع مبنى، ولا مشروعا يخص الماضي وحده؛ وإنما هو مشروع يجمع ذاكرة النعيم بخبرة البحرين، ويصل الماضي بالحاضر، ويهيئ للشباب مساحة لصناعة المستقبل."],["p","ومن هنا فإن كل اسم مدعو إلى اللقاء ينبغي أن ينظر إليه باعتباره جزءا من منظومة التأسيس، لا مجرد ضيف على الاجتماع؛ فبعضهم قد يضيف المعرفة، وبعضهم العلاقات، وبعضهم التوثيق، وبعضهم الرؤية الفنية، وبعضهم الخبرة القانونية أو الاقتصادية، وبعضهم الذاكرة الشعبية، وبعضهم القدرة على الوصول إلى جهات وأشخاص ومصادر قد لا يصل إليها المشروع بوسائل أخرى."],["p","وبذلك يصبح اللقاء الأول نفسه خطوة تنفيذية للمشروع، لأنه لا يكتفي بعرض الفكرة، وإنما يبدأ بتكوين النواة البشرية والمعرفية والمؤسسية التي ستعمل على بلورة المركز وتحديد مهامه ومكوناته واحتياجاته ومساره التنفيذي."],["h","والهدف النهائي"],["lbl","أن نخرج من هذا اللقاء ليس بمجرد اتفاق على أهمية إنشاء مركز النعيم الثقافي والتراثي، وإنما بقناعة مشتركة بأن:"],["p","لكل حاضر دورا يمكن أن يؤديه، ولكل خبرة قيمة يمكن أن تضيفها، ولكل علاقة باب يمكن أن تفتحه، ولكل ذاكرة مادة تستحق أن تحفظ، ولكل فكرة فرصة لأن تتحول إلى جزء من مشروع ثقافي وتراثي مستدام."],["h","وهنا تبدأ المرحلة الحقيقية من التأسيس"],["p","(من يمكن أن يحضر؟\" و \"فيما يمكن أن يساهم؟)،"],["p","(ماذا نريد أن نبني؟\" و \"ماذا نريد أن نحفظ ونقدم للأجيال؟)،"],["p","(ومن فكرة مركز\" إلى \"منظومة مجتمعية قادرة على تأسيسه وتشغيله واستدامته)."]]},{"id":"gate","t":"النعيم... بوابة المنامة","b":[["p","ليست النعيم مجرد حي من أحياء المنامة، ولا محطة عابرة في مسيرة التوسع العمراني للمدينة، بل هي مساحة من الذاكرة البحرينية التي تشكلت فيها ملامح مجتمع عرف البحر والعمل والتجارة والحرف والتعليم والثقافة والفنون والتكافل الاجتماعي، وترك أبناؤه عبر الأجيال بصمات واضحة في مسيرة المجتمع البحريني."],["p","وقد اكتسبت النعيم، بحكم موقعها وامتدادها وعلاقتها بالمنامة، دوراً يتجاوز حدود المكان الجغرافي؛ فكانت في مراحل مختلفة بوابة للمنامة، يمر عبرها الناس، وتتصل من خلالها الحركة التجارية والاجتماعية، وتلتقي فيها مسارات أهل البحر وأصحاب الحرف والتجار والمهنيين والمثقفين وأبناء المجتمع. ومن هذا التداخل نشأت بيئة غنية بالتجارب الإنسانية، صنعت مع الزمن هوية خاصة للمنطقة، وأصبحت جزءاً من قصة المنامة وتاريخ البحرين."],["p","وفي ذاكرة النعيم تفاصيل كثيرة لا تزال حاضرة في وجدان أهلها؛ في أسماء الرجال والنساء الذين أسهموا في بناء المجتمع، وفي القلاليف والبحارة وأهل البحر، وأصحاب المهن والحرف، والتجار وأهل العلم والثقافة والفن والرياضة والعمل الاجتماعي، وفي البيوت القديمة والمساجد والمجالس والأسواق والطرقات، وفي الصور والوثائق والمقتنيات والروايات الشفوية التي تحمل بين تفاصيلها حكايات أجيال متعاقبة."],["p","إن قيمة هذا التراث لا تكمن في كونه جزءاً من الماضي فحسب، وإنما في قدرته على تفسير الحاضر وإلهام المستقبل. فكل صورة قديمة، وكل وثيقة، وكل أداة عمل، وكل حكاية يرويها أحد أبناء النعيم، وكل اسم ارتبط بمهنة أو علم أو خدمة مجتمعية، يمثل جزءاً من نسيج أكبر يستحق أن يجمع ويوثق ويقرأ ويقدم للأجيال بصورة تحفظ أصالته وتمنحه حياة جديدة."],["p","ومن هنا جاءت فكرة إنشاء مركز النعيم الثقافي والتراثي؛ ليكون مشروعاً يتجاوز مفهوم المتحف التقليدي أو المكان الذي تحفظ فيه المقتنيات، وليتحول إلى ذاكرة حية للنعيم، ومجالاً مفتوحاً للتوثيق والبحث والتعليم والعرض والفنون والفعاليات الثقافية، ومنصة تجمع الماضي بالحاضر، وتمنح أبناء المنطقة والأجيال الجديدة فرصة التعرف إلى جذورهم والمشاركة في صياغة مستقبلهم الثقافي."],["p","ولا ينطلق المشروع من افتراض أن محتوى المركز قد اكتمل، بل من إيمان بأن هذا المحتوى موجود في أماكن متعددة: في ذاكرة كبار السن، وفي البيوت، وفي الأرشيفات الخاصة، وفي الصور القديمة، وفي الوثائق والمقتنيات، وفي قصص العائلات، وفي ذاكرة أصحاب المهن والحرف، وفي تجارب الشخصيات التي صنعت حضور النعيم في مختلف المجالات."],["p","لذلك فإن المرحلة الأولى من المشروع تقوم على اكتشاف ما نملك، وتوثيقه، وفهم قيمته، ثم تحديد ما نحتاج إليه، وما يمكن أن نقترحه، ومن يمكن أن يساهم معنا في تحويل هذه الثروة المتناثرة إلى مشروع ثقافي متكامل."],["p","ومن هذا المنظور، فإن المركز المقترح لا يمثل مشروعاً عمرانياً فحسب، وإنما يمثل مشروعاً للهوية والذاكرة والتنمية الثقافية. ويمكن أن يصبح، بحكم موقع النعيم وصلتها التاريخية بالمنامة، نقطة جذب للمهتمين بتاريخ البحرين وتراثها، ونافذة يتعرف من خلالها الزائر على جانب من حياة المجتمع البحريني وتطوره، بما يعزز حضور النعيم بوصفها بوابة للمنامة في السياحة والتراث والتجارة والثقافة."],["p","إننا لا نريد أن نبني مبنى ثم نبحث له عن محتوى، وإنما نريد أن نكتشف أولاً القصة التي تستحق أن تروى، والذاكرة التي تستحق أن تحفظ، والهوية التي تستحق أن تقدم، ثم نبني المكان القادر على احتضانها وعرضها وإيصالها إلى الأجيال."],["p","ومن هنا، يأتي هذا المشروع دعوة إلى أبناء النعيم، وإلى المختصين والباحثين والمؤرخين وأصحاب الخبرة، وإلى كل من يحمل صورة أو وثيقة أو رواية أو معرفة أو تجربة، للمشاركة في بناء هذه الذاكرة بصورة جماعية؛ لأن تاريخ النعيم ليس ملكاً لجيل واحد، وإنما أمانة تتناقلها الأجيال."]]},{"id":"end","t":"خاتمة المشروع","b":[["h","ذاكرة الآباء أمانة... وتراث الأجداد رسالة إلى المستقبل"],["p","في ختام هذا المقترح، لا أجد أجمل من أن أترك هذه الفكرة مفتوحة على آفاق المشاركة والعمل، مؤمناً بأن المشاريع التي تُبنى من أجل الذاكرة والهوية لا تكتمل بجهد فرد، ولا تحقق غاياتها بمجرد إعداد دراسة، وإنما تنمو حين تجد من يؤمن بقيمتها، ويمنحها من وقته وخبرته وفكره وإمكاناته ما تستحقه."],["p","إن ما بين أيدينا ليس مجرد مشروع لإنشاء مركز ثقافي وتراثي، بل دعوة إلى إعادة النظر فيما تركه الآباء والأجداد من إرث إنساني واجتماعي وثقافي، وإلى اكتشاف ما لا يزال حاضراً في ذاكرتنا، وما يستحق أن يُنقذ من النسيان، وأن يُقدم للأجيال بصورة تحفظ أصالته وتكشف معانيه."],["p","ولعل أجمل ما يمكن أن نقدمه لمن سبقونا ليس الاكتفاء بذكر أسمائهم أو استعادة صورهم، وإنما أن نعمل على فهم حياتهم، وتوثيق تجاربهم، وإبراز ما قدموه لمجتمعهم، وإيصال قصصهم إلى أبنائنا وأحفادنا، حتى تبقى آثارهم حاضرة في الوعي، لا غائبة خلف تعاقب السنين."],["p","ومن هنا، فإنني أتوجه بهذا المشروع إلى مركز تمكين شباب النعيم، وإلى مؤسسات ومراكز وجمعيات المنطقة، وإلى الباحثين والمختصين وأصحاب الخبرات، وإلى كل فرد يحمل في ذاكرته صورة أو وثيقة أو رواية أو معرفة، داعياً الجميع إلى التفاعل مع هذه الفكرة، ومراجعتها، وإثرائها، والإسهام في تطويرها، كلٌّ بما يستطيع."],["p","فربما تكون معلومة يحتفظ بها أحد كبار السن مفتاحاً لاكتشاف جانب من تاريخ المنطقة، وربما تكون صورة قديمة شاهداً على مرحلة لا تزال بحاجة إلى التوثيق، وربما تكون حرفة أو مهنة أو تجربة شخصية حلقة مفقودة في قصة أكبر تستحق أن تروى."],["p","إننا أمام فرصة لا ينبغي أن نتعامل معها باعتبارها عملاً مؤجلاً إلى زمن آخر؛ فبعض ما نريد توثيقه يعيش اليوم في ذاكرة أشخاص تقدم بهم العمر، وبعض المقتنيات والوثائق قد تضيع إن لم نبادر إلى جمعها وحفظها، وبعض القصص قد تنطفئ برحيل أصحابها. ولذلك، فإن المبادرة إلى العمل اليوم ليست ترفاً ثقافياً، بل مسؤولية تجاه الذاكرة وأصحابها والأجيال القادمة."],["p","وأملي أن يجد هذا المقترح من يقرأه بعين الشريك، لا بعين المتلقي فحسب؛ وأن يتحول الاطلاع عليه إلى حوار، والحوار إلى تعاون، والتعاون إلى خطوات عملية تضع الأسس لمشروع يستحق أن ينمو ويتطور ويأخذ مكانه بين المشاريع الثقافية والتراثية في مملكة البحرين."],["p","إن إحياء تراث الآباء والأجداد لا يعني أن نعيش في الماضي، وإنما أن نحمل قيمته إلى المستقبل، وأن نمنح أبناءنا فرصة لمعرفة الجذور التي نمت منها حياتهم، والقصص التي صنعت جانباً من هويتهم."],["p","وإذا كان هذا المشروع قد بدأ بفكرة، فإن اكتماله الحقيقي لن يكون إلا بجهود المخلصين الذين يرون في تاريخ النعيم جزءاً من تاريخ البحرين، وفي حفظ ذاكرتها مسؤولية مشتركة، وفي إحياء تراثها عملاً يستحق العناية والتقدير."],["p","فلنجعل من هذه الدراسة بداية لقاء، ومن هذا المقترح مساحة للتعاون، ومن ذاكرة النعيم مشروعاً حياً تتعاقب عليه الأجيال، وتضيف إليه، وتحافظ عليه، وتعيد تقديمه بما يليق بأصالته وثرائه."],["p","فالتراث الذي نحييه اليوم هو الرسالة التي نتركها لأبنائنا غداً، والذاكرة التي نحفظها هي الأثر الذي يبقى شاهداً على من صنعوا تاريخنا."]]},{"id":"letter","t":"نموذج رسالة الدعوة","b":[["h","بسم الله الرحمن الرحيم"],["h","دعوة لحضور المؤتمر التأسيسي لمشروع مركز النعيم الثقافي والتراثي"],["p","السلام عليكم ورحمة الله وبركاته،،،"],["p","الأخ الكريم / الأخت الكريمة ................................ المحترم/ة،،"],["h","التعريف بالشخصية"],["p","يسرنا دعوتكم للمشاركة في المؤتمر التأسيسي لمشروع مركز النعيم الثقافي والتراثي، الذي يأتي انطلاقاً من الرغبة في حفظ وتوثيق الموروث التاريخي والثقافي والاجتماعي لمنطقة النعيم، وإبرازه بصورة تليق بتاريخها وإسهامات أهلها في مسيرة البحرين."],["p","وقد حظيت فكرة المشروع بموافقة) ( على تبنيها ورعايتها في مرحلتها التأسيسية، باعتباره المظلة المؤسسية التي يمكن أن تجمع الجهود والخبرات، وتدعم التنسيق بين أصحاب الشأن والاختصاص، وصولاً إلى بلورة مشروع ثقافي وتراثي يقوم على أسس معرفية ومجتمعية واضحة."],["h","لماذا ندعوكم؟"],["p","إن مشروع مركز النعيم الثقافي والتراثي لا يمكن أن يُبنى من تصور فردي أو من خلال جهة واحدة، بل يحتاج إلى مشاركة أصحاب الخبرة والمعرفة، وأبناء المنطقة الذين يحملون في ذاكرتهم تاريخها وتجاربها وموروثها."],["p","ومن هذا المنطلق، تأتي دعوتكم باعتباركم من أصحاب الشأن أو الخبرة أو الاهتمام الذين يمكن أن يسهموا في إثراء المشروع برؤاهم ومعلوماتهم ومقترحاتهم وعلاقاتهم، والمساعدة في تحديد مكوناته وأولوياته وسبل تطويره ."],["lbl","تشمل دائرة المشاركة، على سبيل المثال لا الحصر:"],["li","القلافين والبحارة وأصحاب الخبرة في التراث البحري."],["li","المؤرخين والباحثين والمتخصصين في تاريخ البحرين."],["li","المتخصصين في آثار البحرين وحضارة دلمون والنقوش."],["li","المصورين وأصحاب الأرشيفات والصور والوثائق."],["li","الفنانين والكتاب والأدباء."],["li","المتخصصين في العمارة والتراث العمراني."],["li","الحرفيين وأصحاب المهن والصناعات التقليدية."],["li","أصحاب الذاكرة والرواية الشفوية والتجارب المحلية."],["li","الوجهاء والتجار والشخصيات المجتمعية في منطقة النعيم."],["li","كل من لديه معرفة أو مقتنيات أو وثائق أو مبادرات يمكن أن تخدم أهداف المشروع."],["h","أهداف المؤتمر التأسيسي"],["lbl","يهدف اللقاء إلى فتح حوار أولي ومنظم حول المشروع، من خلال:"],["ol","عرض الفكرة العامة للمركز وأهدافه ورؤيته المستقبلية."],["ol","التعرف على ما تمتلكه المنطقة من ذاكرة ووثائق وصور ومقتنيات وحرف وتجارب وروايات."],["ol","تحديد المحاور الثقافية والتراثية التي يمكن أن يتضمنها المركز."],["ol","الاستماع إلى آراء أصحاب الاختصاص بشأن الاحتياجات الفنية والتقنية والتجهيزية لكل محور."],["ol","بحث البرامج والأنشطة التي يمكن تنفيذها، مثل المعارض والورش والمحاضرات والفعاليات والمبادرات الشبابية."],["ol","تحديد الجهات والأفراد الذين يمكن التعاون معهم في مراحل المشروع المختلفة."],["ol","بحث آليات تشكيل فرق عمل متخصصة تتابع المحاور وتطور التصور التأسيسي للمركز."],["h","من فكرة أولية إلى مشروع مؤسسي"],["p","نؤكد أن هذا المؤتمر لا يأتي لعرض مشروع مكتمل أو طرح تصور نهائي جاهز للاعتماد، وإنما يمثل الخطوة الأولى في مسار تشاوري وتأسيسي نطمح من خلاله إلى جمع المعرفة بالذاكرة، والخبرة بالممارسة، والشباب بأصحاب الاختصاص."],["p","فالمقصود ليس إنشاء مبنى ثم البحث عن محتوى له، بل العمل أولاً على تحديد هوية المشروع ومحتواه واحتياجاته، ثم دراسة المكان والبرامج والشراكات والموارد التي تمكنه من أداء رسالته."],["p","ونطمح إلى أن يكون المركز مستقبلاً ذاكرة حية للنعيم، ومساحة للبحث والتوثيق والتعلم والإبداع، ومنصة تجمع الأجيال، وتمنح الشباب دوراً حقيقياً في حفظ تراث منطقتهم وتقديمه بصورة معاصرة."],["h","أهمية حضوركم ومساهمتكم"],["p","إن حضوركم لا يمثل مشاركة بروتوكولية، بل نأمل أن يكون إسهاماً عملياً في مرحلة التأسيس، من خلال ما تحملونه من خبرات وتجارب وذكريات ومعلومات وعلاقات يمكن أن تساعد في بناء المشروع على أسس راسخة."],["p","فكل صورة قد توثق مرحلة، وكل وثيقة قد تحفظ معلومة، وكل رواية قد تنقل جانباً من الذاكرة، وكل حرفة قد تحمل تاريخاً، وكل فكرة قد تفتح مجالاً جديداً أمام المشروع."],["p","كما أن اجتماع هذه الكفاءات والشخصيات من أبناء النعيم وأصحاب الاختصاص من شأنه أن يعزز فرص التنسيق والتعاون، ويفتح قنوات التواصل مع الأفراد والمؤسسات والجهات التي يمكن أن تسهم في دعم المشروع وتطويره في مراحله القادمة."],["h","ختاماً"],["p","إننا نتطلع إلى أن يكون هذا المؤتمر بداية لشراكة مجتمعية واسعة، تجمع أبناء النعيم وأصحاب الخبرة والمعرفة، وتسهم في تأسيس مشروع يحفظ موروث المنطقة، ويبرز إسهامات أهلها، ويمنح الأجيال القادمة فرصة التعرف على تاريخهم والاعتزاز به والمشاركة في تطويره."],["p","وإذ نتشرف بدعوتكم، فإننا نأمل أن تحظى الدعوة باهتمامكم، وأن نلتقي بكم للاستفادة من رؤاكم وتوجيهاتكم ومقترحاتكم، والمشاركة معاً في وضع اللبنات الأولى لهذا المشروع."],["p","فالمشروع يبدأ بفكرة، ويكبر بالمشاركة، ويستمر بالعمل المؤسسي، ويترك أثره حين يصبح إرثاً مشتركاً للأجيال."],["p","وتفضلوا بقبول خالص التقدير والاحترام،،،"],["h","المعد والمشارك معكم"],["h","عمار أحمد النشابة"],["h","بالتنسيق مع (...........................)"],["p","التاريخ: ............................"],["p","موعد المؤتمر: ............................"],["p","المكان: ............................"]]}],"cats":[{"id":"c1","ord":"أولا","t":"القيادات المؤسسية والمجتمعية"},{"id":"c2","ord":"ثانيا","t":"الخبرات الحكومية والإدارية والقانونية"},{"id":"c3","ord":"ثالثا","t":"الشخصيات المرتبطة بالتراث والذاكرة المحلية"},{"id":"c4","ord":"رابعا","t":"الثقافة والسياحة والتعريف بالتراث البحريني"},{"id":"c5","ord":"خامسا","t":"الكتاب والباحثون والرواة"},{"id":"c6","ord":"سادسا","t":"الفن والتشكيل والحرف"},{"id":"c7","ord":"سابعا","t":"الإدارة والاقتصاد والاستثمار"},{"id":"c8","ord":"ثامنا","t":"الإعلام والعلاقات العامة"},{"id":"c9","ord":"تاسعا","t":"القيادات المجتمعية والتطوعية في ظل الدراسات النفسية"},{"id":"c10","ord":"عاشرا","t":"الشخصيات المجتمعية والتطوعية"},{"id":"c11","ord":"الحادي عشر","t":"التخطيط العمراني والهندسة والتصميم"}],"people":[{"id":"p01","n":"الأستاذ غازي عبدالمحسن جاسم علي","c":"c1","bio":"رئيس مركز تمكين شباب النعيم، ومدرب معتمد في الإعلام والعلاقات العامة، وله خبرة في التدريب والعمل الإعلامي والأنظمة الصوتية، إلى جانب حضوره في العمل الأهلي والتطوعي.","role":"يمثل وجوده البعد المؤسسي للمشروع، باعتبار مركز تمكين شباب النعيم الحاضن المقترح للمبادرة. ويمكن لخبرته في الإعلام والعلاقات العامة أن تسهم في بناء هوية المشروع، وإدارة التواصل معه، وفتح قنوات التعريف به واستقطاب الكفاءات والشركاء.","impact":"إعطاء المشروع مظلة مؤسسية واضحة منذ بدايته، وربط المشروع برسالة المركز في تمكين الشباب وخدمة المجتمع."},{"id":"p02","n":"الأستاذ كامل جعفر آل رضي","c":"c1","bio":"نائب رئيس مركز تمكين شباب النعيم.","role":"المساهمة في الجانب الإداري والتنظيمي، ومتابعة التنسيق بين المشروع ومجلس إدارة المركز، والمساعدة في تحويل مخرجات اللقاءات إلى خطوات عملية قابلة للمتابعة.","impact":"تعزيز الجانب المؤسسي للمشروع، وإظهار أن المبادرة تحظى باهتمام قيادة المركز منذ مرحلة التأسيس."},{"id":"p03","n":"الأستاذ أحمد عبدالكريم مكي عيسى الكوفي","c":"c1","bio":"رئيس مجلس إدارة جمعية النعيم الخيرية.","role":"ربط المشروع بالعمل الأهلي والاجتماعي في المنطقة، والاستفادة من خبرة الجمعية وشبكة علاقاتها المجتمعية، وما يمكن أن توفره من دعم للتواصل مع الأسر والشخصيات والمهتمين بتاريخ النعيم.","impact":"توسيع قاعدة المشروع من مركز الشباب إلى منظومة العمل الأهلي في النعيم، وإعطاء المشروع بعدا مجتمعيا أوسع."},{"id":"p04","n":"الأستاذ مهدي حسن علي الكليتي","c":"c1","bio":"نائب رئيس جمعية النعيم الخيرية، وله حضور مهني ومجتمعي وخبرة في العمل الصحي والخيري.","role":"المساهمة في الجانب المجتمعي والتنظيمي، وربط المشروع بالمبادرات والطاقات التطوعية في المنطقة، ودعم التنسيق بين المؤسسات الأهلية والمجتمعية.","impact":"تعزيز فكرة أن المركز المقترح يمكن أن يكون منصة جامعة للطاقات والخبرات الموجودة في النعيم."},{"id":"p05","n":"الأستاذ صادق أحمد رحمة","c":"c1","bio":"شخصية وطنية واجتماعية بارزة، عُرف بدوره في العمل البلدي والخيري المرتبط بمنطقة النعيم والعاصمة المنامة، ومتابعته المستمرة للقضايا الخدمية وتطوير البنية التحتية فيها. كما شغل منصب رئيس سابق لجمعية النعيم الخيرية، وله حضور واسع في الفعاليات والمناسبات الاجتماعية والدينية، ومساهمات في توثيق تاريخ العمل الخيري والاجتماعي بالمنطقة.","role":"المساهمة في توثيق تاريخ العمل الأهلي والخيري في النعيم، والاستفادة من خبرته في متابعة قضايا المنطقة وعلاقاتها المجتمعية، وربط المشروع بالشخصيات والمؤسسات التي أسهمت في خدمة المجتمع.","impact":"تعزيز البعد التاريخي والاجتماعي للمشروع، وإبراز تطور العمل الأهلي والخيري باعتباره جزءا من ذاكرة النعيم وهويتها المجتمعية."},{"id":"p06","n":"الأستاذ عبدالواحد الإسكافي","c":"c1","bio":"رئيس لجنة الحكام في اتحاد كرة اليد، وأحد رواد مركز تمكين شباب النعيم الذين أسهموا في قيام المركز من خلال جهودهم وحضورهم.","role":"المساهمة في استحضار ذاكرة تأسيس مركز تمكين شباب النعيم، وتوثيق جهود الرواد والمراحل الأولى للعمل الشبابي والرياضي، إلى جانب دعم المبادرات التي تربط الرياضة بالشباب والعمل المجتمعي.","impact":"ربط مشروع المركز الثقافي والتراثي بتاريخ الحركة الشبابية في النعيم، وحفظ جهود الرواد الذين أسهموا في بناء المؤسسات والمبادرات المجتمعية."},{"id":"p07","n":"الأستاذ حميد يوسف رحمه","c":"c2","bio":"وكيل مساعد سابق للتجارة المحلية بوزارة الصناعة والتجارة والسياحة، ورئيس جمعية النعيم الخيرية سابقاً،","role":"الاستفادة من خبرته الحكومية والإدارية في فهم آليات التعامل مع الجهات الرسمية والقطاع الخاص، ودراسة الجوانب المتعلقة بالشراكات والاستثمار والاستدامة الاقتصادية للمشروع.","impact":"إضافة بعد إداري واقتصادي للمشروع، وعدم حصره في الجانب الثقافي والتراثي فقط."},{"id":"p08","n":"المحامي جعفر عبدالامير الشيخ","c":"c2","bio":"محام بحريني ومحكم تجاري، وله حضور في العمل المجتمعي والأهلي، أمين سر جمعية النعيم الخيرية.","role":"المساهمة في دراسة الأطر القانونية والتنظيمية للمشروع، وطبيعة الشراكات والاتفاقيات، وآليات حفظ حقوق المشروع ومقتنياته ووثائقه، وما يرتبط بالملكية الفكرية والتبرعات والمساهمات.","impact":"توفير رؤية قانونية مبكرة تساعد على تأسيس المشروع بطريقة مؤسسية سليمة."},{"id":"p09","n":"سلمان سالم سليم","c":"c2","bio":"برلماني بحريني سابق وعضو سابق في مجلس النواب بمملكة البحرين، وعُرف بكتابة المقالات والتحليلات السياسية والاجتماعية في الصحافة البحرينية، إلى جانب حضوره الاجتماعي والثقافي.","role":"المساهمة في دراسة الجوانب المجتمعية والمؤسسية للمشروع، والاستفادة من خبرته العامة في قراءة القضايا الاجتماعية والتواصل مع مختلف فئات المجتمع، إلى جانب دعم الجانب التوثيقي والتحليلي للمبادرة.","impact":"إضافة رؤية اجتماعية ووطنية للمشروع، وربط المركز بالقضايا المرتبطة بتطور المجتمع والذاكرة العامة والتحولات التي مرت بها المنطقة."},{"id":"p10","n":"الأستاذ جمال صالح دهنيم","c":"c3","bio":"رئيس لجنة المشاريع بجمعية النعيم الخيرية، وله ارتباط طويل بالعمل الاجتماعي والثقافي والخيري في المنطقة، كما يرتبط تاريخ عائلته بالبحر وتجارة اللؤلؤ والغوص، وله اهتمام واضح بالتراث والأعمال الفنية والتراثية.","role":"المساهمة في استحضار الذاكرة الاجتماعية والتراثية للنعيم، وربط المشروع بالأسر والقصص والمقتنيات والصور واللوحات والمواد التراثية الموجودة لدى الأهالي.","impact":"تعزيز الجانب المحلي للمشروع، بحيث لا يكون التراث مادة نظرية، بل ذاكرة حية مرتبطة بأهل النعيم وتاريخهم."},{"id":"p11","n":"الأستاذ الدكتور يوسف أحمد بن ماجد النشابة","c":"c3","bio":"باحث وكاتب في التراث، وله اهتمام خاص بصناعة السفن في البحرين وما يرتبط بها من معتقدات شعبية وقصص وروايات، وبثقافة القلافين ولغتهم الخاصة.","role":"الإسهام في تأسيس محور البحر وصناعة السفن والقلافة والغوص، وتحديد ما ينبغي توثيقه من المصطلحات والحكايات والأدوات والمهن والشخصيات والممارسات المرتبطة بهذا التراث.","impact":"إعطاء المشروع عمقا تراثيا متخصصا، وتحويل الذاكرة البحرية من مجرد صور ومقتنيات إلى مادة معرفية موثقة."},{"id":"p12","n":"الأستاذ سعيد إبراهيم القلاف","c":"c3","bio":"كاتب وباحث تراثي بحريني، ومؤلف كتاب (دروازة النعيم و ليوان النعيم) الذي يوثق تاريخ منطقة النعيم في البحرين.","role":"المساهمة في توثيق تاريخ النعيم ومراحل تطورها، والاستفادة من تجربته الكتابية والبحثية في جمع المعلومات والروايات والصور والوثائق، وتحويلها إلى مواد معرفية يمكن عرضها ونشرها ضمن برامج المركز.","impact":"إضافة مصدر معرفي مهم لتوثيق تاريخ النعيم، وربط المشروع بالمؤلفات والجهود السابقة التي تناولت تاريخ المنطقة وذاكرتها المحلية."},{"id":"p13","n":"الأستاذ علي سلطان السلاطنة","c":"c3","bio":"شاعر شعبي بحريني من منطقة النعيم، وله إنتاج في المجالات الدينية والاجتماعية والوطنية والتراثية.","role":"المساهمة في توثيق الشعر الشعبي واللغة المحلية والموروث الشفهي، وجمع القصائد والروايات والتعبيرات التي تعكس وجدان المجتمع وذاكرته الاجتماعية والثقافية.","impact":"إبراز الشعر واللغة الشعبية باعتبارهما جزءا أصيلا من التراث غير المادي للنعيم، وإتاحة المجال لتقديم الذاكرة المحلية بأسلوب أدبي وفني."},{"id":"p14","n":"الأستاذ ميرزا النشيط","c":"c4","bio":"من الشخصيات المرتبطة بمجالي السياحة والثقافة، وله حضور في مجال الإرشاد السياحي والعمل المرتبط بالتعريف بالتراث البحريني.","role":"دراسة كيفية تقديم مركز النعيم الثقافي والتراثي كوجهة ثقافية وسياحية، وربطه بالمسارات السياحية والتراثية في مملكة البحرين، والاستفادة من خبرته في بناء المحتوى الذي يخاطب الزائر والسائح.","impact":"نقل المشروع من نطاق الذاكرة المحلية إلى إمكانية أن يصبح نقطة جذب ثقافية وتراثية ضمن المشهد السياحي في البحرين."},{"id":"p15","n":"الإعلامي الرحالة محمود النشيط","c":"c4","bio":"له اهتمام بالإعلام والسياحة والدراسات السياحية، وله تجربة في الصحافة السياحية المتخصصة.","role":"المساهمة في وضع تصور إعلامي وسياحي للمركز، وكيفية تحويل محتواه إلى قصص ومواد إعلامية تصل إلى الجمهور البحريني والزائر، إضافة إلى التفكير في البرامج والرحلات والمسارات التي يمكن أن ترتبط بالمركز.","impact":"تعزيز قابلية المشروع للظهور إعلاميا وتحويله إلى تجربة يمكن التعريف بها محليا وخارجيا."},{"id":"p16","n":"الأستاذ الكاتب جمعة السترواي","c":"c5","bio":"كاتب وداعم للمشاريع والمبادرات المجتمعية، وله حضور في العمل الخيري والاجتماعي.","role":"المساهمة في الجانب الثقافي والكتابي للمشروع، وتطوير المبادرات والبرامج التي تجعل المركز مساحة للحوار والكتابة والتوثيق والنشر.","impact":"تعزيز البعد الثقافي والفكري للمركز وربطه بالحركة المجتمعية."},{"id":"p17","n":"الدكتورة غنية عليوي","c":"c5","bio":"أكاديمية وباحثة وكاتبة وناشطة اجتماعية.","role":"الإسهام في الجانب البحثي والمعرفي، ووضع منهجية للتوثيق والدراسات والبحوث التي يمكن أن ينتجها المركز، وربط التراث بالمجتمع والتعليم والمعرفة.","impact":"إضافة البعد الأكاديمي والبحثي للمشروع، بما يساعد على تأسيس مركز لا يكتفي بعرض التراث، وإنما ينتج المعرفة حوله."},{"id":"p18","n":"الأستاذ محمود عبدالصاحب البقلاوة","c":"c5","bio":"باحث ومؤرخ وفنان، وله اهتمام بالإرث البحريني والحضارة الدلمونية وتوظيف عناصرها في الأعمال الفنية.","role":"المساهمة في الربط بين التاريخ والآثار والرموز الحضارية والفن، وتقديم رؤية حول كيفية عرض الموروث البحريني والدلموني بصورة معاصرة.","impact":"إضافة عمق حضاري وفني للمشروع، وربط النعيم بتاريخ البحرين الأوسع."},{"id":"p19","n":"المهندس عبدالله حسن عمران","c":"c5","bio":"مهندس وباحث بحريني مهتم بتوثيق التراث والمهن الشعبية، ومن أبرز أعماله كتاب «المهن الشعبية في البحرين – سوق الحدادة أنموذجاً»، الذي يوثق تاريخ سوق الحدادة وفريق الحدادين.","role":"الإسهام في توثيق المهن والحرف التقليدية المرتبطة بالنعيم، وإثراء الجانب البحثي والتراثي للمركز.","impact":"تعزيز البعد التوثيقي والعلمي للمشروع وربط المهن الشعبية بالذاكرة الاجتماعية للمنطقة."},{"id":"p20","n":"الدكتورة جميلة يوسف الوطني","c":"c5","bio":"حاصلة على الدكتوراه في القانون، ومستشارة وخبيرة قانونية في البيئة، إلى جانب اهتمامها بالشعر والكتابة والرواية.","role":"الإسهام في الجمع بين البعد القانوني والثقافي والبيئي والكتابي، ودراسة فرص توظيف هذه الجوانب في برامج المركز ومحتواه.","impact":"إضافة شخصية متعددة الخبرات قادرة على النظر إلى المشروع من أكثر من زاوية، وربط التراث بالقضايا القانونية والبيئية والثقافية."},{"id":"p21","n":"الأستاذ محمد الأحمدي","c":"c5","bio":"رئيس مركز البحرين للمستثمرين، ومستشار بمكتب الوكيل المساعد للتجارة المحلية، وكاتب قصص وروايات وموضوعات اجتماعية، ومستشار في التنمية البشرية.","role":"المساهمة في دراسة الجوانب الإدارية والاستثمارية، وفتح قنوات التواصل مع الجهات الاقتصادية، إلى جانب دعم المحتوى الاجتماعي والكتابي وبرامج تنمية القدرات البشرية.","impact":"الجمع بين الخبرة الإدارية والاقتصادية والاهتمام الثقافي والإنساني، بما يدعم بناء مشروع قادر على استثمار الطاقات وتطوير موارده وشراكاته."},{"id":"p22","n":"الاستاذ الفنان عباس الموسوي","c":"c6","bio":"فنان معروف بأعماله الفنية التي تتناول الطبيعة والسلام والبيئة البحرينية، وله مبادرات اجتماعية ومجتمعية.","role":"المساهمة في بناء الهوية البصرية والفنية للمركز، واقتراح المعارض والأعمال الفنية التي يمكن أن تربط الفن بالبيئة والذاكرة البحرينية.","impact":"رفع القيمة الفنية والجمالية للمشروع، وفتح المجال أمام الفن ليكون جزءا من طريقة تقديم التراث، وليس مجرد عنصر تجميلي."},{"id":"p23","n":"الأستاذ الفنان والخزاف محسن التيتون","c":"c6","bio":"من المهتمين بفن الخزف، وله تجربة في المعارض والندوات، وارتبط اسمه بتشجيع انتشار الخزف في المجتمع.","role":"تأسيس تصور لمحور الحرف والفنون التطبيقية، وخاصة الخزف، وطرح فكرة الورش والمعارض والتعليم الحرفي وربط الحرفة بالاقتصاد الإبداعي.","impact":"إدخال الحرفة من كونها مادة للعرض إلى كونها مهارة حية يمكن تعليمها وإنتاجها وتطويرها وتسويقها."},{"id":"p24","n":"الأستاذ أحمد صالح النعيمي","c":"c7","bio":"رئيس تنفيذي ورجل أعمال، وله تجربة في تأسيس الشركات والاستشارات والاستثمار، إلى جانب حضور اجتماعي وثقافي في النعيم، وعضو في مجلس الأوقاف الجعفرية.","role":"المساهمة في دراسة الاستدامة المالية للمشروع، ونماذج الشراكة مع القطاع الخاص، وفرص الاستثمار في الأنشطة الثقافية والحرفية والسياحية، بما يساعد المركز على بناء نموذج قابل للاستمرار.","impact":"إضافة البعد الاقتصادي والاستثماري، والتأكيد على أن المشروع يحتاج منذ البداية إلى التفكير في استدامته وليس فقط في تأسيسه."},{"id":"p25","n":"الأستاذ علي إبراهيم النشابة","c":"c7","bio":"محاسب قانوني، وصاحب كتاب (استثمار قدرات الإنسان البحريني الإبداعية) وله مساهمات في العمل المجتمعي والتطوعي وحضور ثقافي واجتماعي.","role":"المساهمة في دراسة الجانب الإداري والمالي والاستدامة، وربط المشروع بفكرة استثمار الطاقات البشرية والإبداعية، وهي من أهم مرتكزات المركز المقترح.","impact":"تعزيز فكرة أن المركز يمكن أن يكون منصة لاكتشاف القدرات وتنميتها واستثمارها، وليس مجرد مكان لحفظ الماضي."},{"id":"p26","n":"الدكتور حسن عبدالعزيز الماضي","c":"c7","bio":"خبير مالي واكتواري وعضو سابق في مجلس إدارة التأمينات الاجتماعية، إلى جانب حضوره الاجتماعي والثقافي في النعيم.","role":"المساهمة في دراسة النماذج المالية والإدارية، وبحث آليات الاستدامة والتمويل والشراكات، وتقديم المشورة المتعلقة بالتخطيط المالي وإدارة الموارد.","impact":"تعزيز الجانب المالي والاستراتيجي للمشروع، والمساعدة في بناء تصور واقعي لاستدامته واستمراريته على المدى البعيد."},{"id":"p27","n":"الأستاذ الوجيه عبدالصمد النشابة","c":"c7","bio":"محاسب ومصرفي في مجال البنوك والبورصة، ومؤسس (شركة صبايا) المتخصصة بتزويد البحرين والدول المجاورة بمعدات التجميل بأنواعها، إلى جانب حضوره الاجتماعي والثقافي، ويشغل منصب الأمين العام لجمعية التجمع القومي.","role":"المساهمة في دراسة الجوانب الاقتصادية والاستثمارية، والاستفادة من خبرته في الإدارة والتجارة والعلاقات المؤسسية، إلى جانب دعم التواصل مع أصحاب الأعمال والقطاع الخاص.","impact":"إضافة خبرة اقتصادية وتجارية للمشروع، وفتح المجال أمام دراسة فرص الشراكة والاستثمار التي يمكن أن تدعم البرامج الثقافية والحرفية والتراثية."},{"id":"p28","n":"الأستاذ علي إبراهيم السلاطنة","c":"c8","bio":"حاصل على درجة الماجستير في الإعلام والعلاقات العامة، وله إسهامات في العمل التطوعي في النعيم.","role":"المساهمة في إعداد استراتيجية الاتصال والإعلام للمشروع، وبناء المحتوى الإعلامي، وتوثيق مراحل التأسيس، وإدارة التواصل مع المجتمع والجهات المختلفة.","impact":"توفير عنصر إعلامي متخصص يساعد على إيصال المشروع إلى الجمهور، وتحويل خطواته إلى قصة مجتمعية يتفاعل معها الناس."},{"id":"p29","n":"الأستاذ جعفر حميد النشيط","c":"c8","bio":"من أبناء منطقة النعيم، وله حضور ومساهمات في العمل الاجتماعي والثقافي والقرآني والتطوعي، مع اهتمام واضح بتطوير العمل المؤسسي والإعلام المجتمعي والاستفادة من التقنية في خدمة المبادرات والأعمال المجتمعية.","role":"المساهمة في الجوانب التنظيمية والإعلامية والرقمية للمشروع، وتوثيق المعلومات والبيانات المتعلقة بتراث النعيم وشخصياتها ومبادراتها، إلى جانب تطوير الأنظمة والوسائل الرقمية التي تساعد في جمع المحتوى التراثي وحفظه وتصنيفه وإتاحته، والمساهمة في التواصل الإعلامي والتعريف بالمشروع ومراحله وفعالياته.","impact":"الجمع بين الخبرة في العمل المجتمعي والتنظيم والإعلام والتقنية، بما يعزز قدرة المشروع على توثيق التراث بصورة منهجية، وتحويل المادة التاريخية والاجتماعية إلى محتوى منظم وقابل للحفظ والنشر والاستفادة منه مستقبلاً، مع دعم استدامة المشروع وتوسيع دائرة المشاركة المجتمعية فيه."},{"id":"p30","n":"الكابتن عباس جاسم السلاطنة","c":"c8","bio":"من الشخصيات الرياضية البارزة من أبناء منطقة النعيم، ومن الأسماء التي ارتبطت بتاريخ لعبة كرة اليد في المنطقة والبحرين لعقود طويلة. مارس اللعبة لاعباً مع منتخب البحرين وفريق نادي النعيم، ثم انتقل إلى مجال التدريب والعمل الفني والإداري، وأسهم بصورة واضحة في استقطاب الناشئين وتدريبهم وتنمية مهاراتهم وصقل مواهبهم وإعداد جيل جديد من لاعبي كرة اليد.","role":"المساهمة في توثيق تاريخ الحركة الرياضية في النعيم، وبالأخص مسيرة كرة اليد ولاعبيها ومدربيها وشخصياتها البارزة، وجمع الروايات والصور والوثائق والذكريات الرياضية، والمساعدة في التعريف بالأجيال التي أسهمت في تأسيس الحركة الرياضية وتطويرها، بما يحفظ هذا الجانب من تاريخ المنطقة للأجيال القادمة.","impact":"يمثل حضور الكابتن عباس السلاطنة امتداداً حياً لذاكرة الرياضة في النعيم، والاستفادة من تجربته الطويلة وخبرته الميدانية تسهم في توثيق مرحلة مهمة من تاريخ شباب المنطقة وإنجازاتهم الرياضية، وإبراز قصص اللاعبين والمدربين الذين أسهموا في صناعة الحركة الرياضية وبناء الأجيال، بما يعزز صورة النعيم بوصفها بيئة أنتجت شخصيات رياضية كان لها حضور وعطاء مستمر على مدى عقود."},{"id":"p31","n":"الدكتور فاضل جاسم النشيط","c":"c9","bio":"استشاري في الطب النفسي، ورئيس اللجنة العليا المنظمة لحملة التبرع بالدم، ويُعرف بحضوره البارز في العمل التطوعي والمجتمعي، حيث سبق أن اشتهر بعطائه ومشاركته في خدمة المجتمع قبل أن يُعرف بصفته المهنية كاستشاري في الطب النفسي.","role":"المساهمة في بناء الجانب المجتمعي والتطوعي للمركز، والاستفادة من خبرته في تنظيم المبادرات واستقطاب المتطوعين وتشكيل فرق العمل وإدارة الفعاليات المجتمعية. كما يمكن الاستفادة من رؤيته في تصميم برامج تستقطب مختلف فئات المجتمع، وخاصة الشباب، وتجعل المركز مساحة للمشاركة والعطاء وليس مجرد موقع لحفظ التراث.","impact":"تعزيز البعد الإنساني والتطوعي للمشروع، وترسيخ فكرة أن المركز مساحة لتنمية الإنسان وخدمة المجتمع إلى جانب حفظ الذاكرة والتراث."},{"id":"p32","n":"الوجيه عبدالنبي أحمد الماي","c":"c10","bio":"وجيه ورجل أعمال بحريني من أبناء منطقة النعيم، وله حضور اجتماعي وتجاري معروف، إلى جانب مساهماته في دعم عدد من الفعاليات واللجان والمبادرات الخيرية والثقافية في المنطقة والمناطق المجاورة، بما يعكس ارتباطه بالمجتمع واهتمامه بالمبادرات ذات الأثر العام.","role":"المساهمة في دعم المشروع من خلال الخبرة التجارية والاجتماعية، وفتح مجالات للتواصل مع رجال الأعمال والمؤسسات الاقتصادية، والمساندة في توفير أوجه الدعم والرعاية والشراكات التي يحتاجها المشروع، إلى جانب الإسهام في تعزيز ارتباط المشروع بالمجتمع المحلي وأهالي النعيم.","impact":"الاستفادة من مكانته الاجتماعية وخبرته التجارية وعلاقاته المجتمعية في تعزيز حضور المشروع واستدامته، وربط الجانب التراثي والثقافي بالقطاع الأهلي والتجاري، بما يفتح المجال أمام شراكات ودعم مستمر يساعد على تحويل المشروع من فكرة توثيقية إلى معلم تراثي وثقافي يحظى بمشاركة المجتمع وأبنائه."},{"id":"p33","n":"الوجيه حسين العلي (أبو بسام)","c":"c10","bio":"من الشخصيات الاجتماعية البارزة، ويُعرف بوجاهته ومجلسه المفتوح الذي يمثل ملتقى للشخصيات الاجتماعية والأهلية، ومساحة للتواصل وتبادل الآراء والخبرات.","role":"المساهمة في تعزيز التواصل المجتمعي، وفتح المجال أمام الوصول إلى الشخصيات والأسر والأهالي ممن يمتلكون ذكريات أو وثائق أو مقتنيات مرتبطة بتاريخ النعيم، إلى جانب دعم اللقاءات المجتمعية المرتبطة بالمشروع.","impact":"تعزيز الثقة المجتمعية بالمشروع، وربطه بالمجالس والروابط الاجتماعية التي تمثل جزءا من الذاكرة الحية للمنطقة."},{"id":"p34","n":"الأستاذة حنان حماد","c":"c10","bio":"ناشطة بحرينية بارزة ومؤسسة مبادرة Dream Big، ولها حضور في الأوساط الشبابية واهتمام بدعم الطاقات والمبادرات المجتمعية.","role":"المساهمة في بناء البرامج الشبابية والتطوعية، واستقطاب الطاقات الشابة، وتطوير مبادرات تربط التراث بالابتكار والإبداع والعمل المجتمعي، والاستفادة من خبرتها في دعم المبادرات وتحفيز المشاركين.","impact":"إضفاء بعد شبابي وتطوعي على المشروع، والمساعدة في تحويل المركز إلى مساحة تفاعلية تستقطب الشباب وتمنحهم دورا في حفظ التراث وتطويره."},{"id":"p35","n":"الأستاذة زينب الزاير","c":"c10","bio":"شخصية فاعلة في تنظيم أنشطة وفعاليات جمعية النعيم الخيرية، وتشارك في تنسيق الفعاليات المجتمعية، ومنها بازارات الأسر المنتجة والأنشطة الشبابية والخيرية.","role":"المساهمة في تنظيم الفعاليات والمعارض والبرامج المجتمعية، وربط المشروع بالأسر المنتجة وأصحاب المهارات والمبادرات المحلية، مع دعم مشاركة المرأة والشباب في أنشطة المركز.","impact":"تعزيز الجانب التنفيذي والمجتمعي للمشروع، وتحويل المركز إلى منصة تستوعب المبادرات والمنتجات والطاقات المحلية."},{"id":"p36","n":"الأستاذة حوراء حبيب آل نوح","c":"c10","bio":"ناشطة اجتماعية وتربوية، ولها حضور محلي في منطقة النعيم من خلال الإشراف والمشاركة في تنظيم حفلات تكريم الطالبات المتفوقات، وتقديم الكلمات التحفيزية ودعم المسيرة التعليمية.","role":"المساهمة في إعداد البرامج التعليمية والتربوية، وربط المشروع بالمدارس والطلبة والمتفوقين، واقتراح مبادرات تحفز الأجيال الجديدة على التعرف إلى تاريخ المنطقة وتراثها والمشاركة في توثيقه.","impact":"ربط المشروع بالجانب التعليمي والتربوي، وتعزيز انتقال المعرفة بالتراث من جيل إلى آخر بأسلوب محفز وتفاعلي."},{"id":"p37","n":"الأستاذ محمد أحمد النشابة","c":"c10","bio":"يتمتع الأستاذ محمد أحمد النشابة بخلفية أكاديمية في العمل الاجتماعي، إلى جانب حضور مجتمعي وتطوعي فاعل، ومشاركة في الأنشطة والفعاليات التي تنظمها مؤسسات العمل الخيري والاجتماعي. كما أسهم في فعاليات وبرامج اجتماعية ومعارض، واهتم بالمبادرات الداعمة للأسر وتعزيز التواصل المجتمعي، إضافة إلى حضوره في الندوات واللقاءات الاجتماعية والتاريخية المرتبطة بتاريخ المنطقة وأهلها.","role":"يمكن أن يسهم الأستاذ محمد أحمد النشابة في الجانب المجتمعي والإنساني والتوثيقي للمشروع، مستفيدًا من خلفيته في العمل الاجتماعي والتطوعي ومشاركته في الفعاليات والندوات. كما يمكن أن يشارك في التواصل مع الأسر وأفراد المجتمع، ورصد الذاكرة الاجتماعية، وتشجيع جمع القصص والصور والوثائق والمعلومات التي تسهم في بناء محتوى المركز.","impact":"يمثل حضور الأستاذ محمد أحمد النشابة إضافة للجانب الاجتماعي والإنساني للمشروع، ويسهم في ربط المركز بالمجتمع، بحيث يمتد توثيق تراث النعيم إلى الإنسان وذكرياته وتجربته الاجتماعية بوصفها جزءًا أصيلًا من ذاكرة المنطقة."},{"id":"p38","n":"أحمد مهدي السكري","c":"c10","bio":"عضو اللجنة العليا المنظمة لحملة التبرع بالدم، وداعم للمبادرات المجتمعية والخيرية.","role":"خبرة في العمل المجتمعي والإدارة والتنسيق المؤسسي، وفتح قنوات تعاون وشراكات تخدم برامج المركز.","impact":"يعزز حضورُه البعد المؤسسي والمجتمعي للمشروع، ويفتح المجال أمام الاستفادة من خبراته وعلاقاته في تنظيم المبادرات وبناء الشراكات."},{"id":"p39","n":"سعيد أحمد مرهون","c":"c10","bio":"رئيس مجلس أمناء جمعية النعيم الخيرية سابقاً، وفاعل في العمل الأهلي والمجتمعي.","role":"خبرة في العمل الخيري والمؤسسي، ومعرفة باحتياجات المجتمع، والمساهمة في إشراك مختلف الفئات في المشروع وبرامجه.","impact":"يعزز حضورُه البعد الأهلي والمجتمعي للمشروع، ويدعم ارتباط المركز بالمؤسسات الخيرية والفعاليات المجتمعية واحتياجات أهالي النعيم."},{"id":"p40","n":"سامي نوح «أبو أحمد»","c":"c10","bio":"من الكوادر المجتمعية والإدارية في النعيم، وذو خبرة في العمل الأهلي والتواصل المجتمعي.","role":"يمثل حضوره خبرة مهمة في التواصل مع كبار السن والرعيل الأول وتوثيق الذاكرة الشفوية، إلى جانب خبرته الإدارية في العمل الأهلي. ويمكن الاستفادة منه في جمع الروايات والصور والمعلومات المرتبطة بتاريخ النعيم وشخصياتها.","impact":"يعزز حضورُه جانب الذاكرة الشفوية والتوثيق المحلي، من خلال خبرته في التواصل مع كبار السن والرعيل الأول ومعرفته بشخصيات وأحداث من تاريخ النعيم."},{"id":"p41","n":"الأستاذة زينب المرخي","c":"c10","bio":"شخصية مجتمعية وتطوعية، ترتبط بالأنشطة والفعاليات الخاصة بمؤسسات العمل الخيري والاجتماعي في منطقة النعيم، وبالأخص الفعاليات النسوية والبرامج المشتركة والمعارض ودعم الأسر وتطوير المهارات.","role":"المساهمة في إعداد وتنظيم البرامج النسوية والاجتماعية، واستقطاب المشاركات والمتطوعات، ودعم المعارض والورش والفعاليات التي تسهم في إبراز مهارات المجتمع وطاقاته.","impact":"توسيع دائرة المشاركة المجتمعية في المشروع، وإبراز دور المرأة في التوثيق والعمل التطوعي وتنمية المهارات والحفاظ على الموروث الاجتماعي."},{"id":"p42","n":"المهندس رضا محمد الأدرج","c":"c11","bio":"يشغل حاليا منصب نائب الرئيس التنفيذي للتطوير والمشاريع في شركة بوابة دلمون العقارية. وسبق أن شغل منصب الوكيل المساعد للمشاريع الإسكانية بوزارة الإسكان والتخطيط العمراني، حيث ارتبط عمله بالإشراف على المشاريع الإسكانية وتطوير الشراكات مع القطاع الخاص وبرامج السكن الاجتماعي، مثل (برنامج مزايا) .","role":"المساهمة في دراسة الاحتياجات العمرانية والمكانية للمركز، وتقديم الرأي في اختيار الموقع وتطوير الشراكات، والاستفادة من خبرته في إدارة المشاريع والتخطيط والتعاون بين القطاعين العام والخاص.","impact":"إضافة خبرة متخصصة في التخطيط والتطوير وإدارة المشاريع، بما يساعد على الانتقال من الرؤية العامة إلى تصور مكاني وتنفيذي قابل للدراسة."},{"id":"p43","n":"المهندس محمد عبدالصمد النشابة","c":"c11","bio":"المدير العام لشركة بلوزون للهندسة والتصميم الداخلي والإنشاءات وتجديد المباني، وله خبرة في التصميم والعمارة وتنفيذ المشاريع وتطوير الواجهات وتحويل المساحات القائمة إلى بيئات جديدة ذات طابع جمالي ووظيفي.","role":"المساهمة في وضع التصور العمراني والتصميمي للمركز، ودراسة كيفية توظيف العمارة والتصميم الداخلي في عرض التراث، مع بحث إمكانات إعادة تأهيل المباني أو المساحات وتحويلها إلى بيئات ثقافية وتراثية.","impact":"ربط المحتوى التراثي بالتصميم والهوية المعمارية، والمساعدة في بناء مكان يجمع بين الوظيفة الثقافية والقيمة الجمالية والهوية المحلية."}],"phases":[{"n":1,"t":"تشكيل فريق إدارة المشروع","s":"الإجراءات المقترحة لتشكيل فريق عمل واضح الهيكل وخطة زمنية أولية لإدارة المشروع.","d":"شهر"},{"n":2,"t":"رسم خريطة المجتمع والمهتمين والمعنيين","s":"قاعدة بيانات مجتمعية شاملة للكفاءات وأصحاب الخبرة والمهتمين بالمشروع.","d":"شهر"},{"n":3,"t":"برنامج اللقاءات التشاورية","s":"الاستماع المباشر إلى أصحاب الاختصاص والخبرة، وعدم الاكتفاء بالتصور النظري للمشروع.","d":"2–3 أشهر"},{"n":4,"t":"دراسة احتياجات كل قسم","s":"بعد انتهاء اللقاءات التشاورية، يتم تشكيل مجموعات عمل لدراسة احتياجات كل قسم بصورة مستقلة.","d":"شهران"},{"n":5,"t":"إعداد استراتيجية الأقسام والفعاليات","s":"بعد جمع نتائج اللقاءات ودراسات الاحتياجات، يتم إعداد استراتيجية متكاملة للمركز.","d":"شهر"},{"n":6,"t":"إعداد الوثيقة الاستراتيجية للمشروع","s":"وثيقة تأسيسية متكاملة لمشروع مركز النعيم الثقافي والتراثي.","d":"شهر"},{"n":7,"t":"إعداد التصور المكاني والهندسي","s":"يجب أن يكون التصميم الهندسي نتيجة لاحتياجات المشروع وليس سابقاً عليها.","d":"حسب الموقع"},{"n":8,"t":"بناء الشراكات والدعم","s":"تحويل المشروع إلى مشروع مجتمعي تشاركي واسع وليس مبادرة معزولة.","d":"بالتوازي"},{"n":9,"t":"التنفيذ المرحلي","s":"لا يشترط انتظار اكتمال المبنى لبدء المشروع، بل يمكن إطلاق المشروع تدريجياً.","d":"بالتوازي مع الدراسة"}],"depts":[{"id":"history","t":"قسم تاريخ النعيم والذاكرة الشعبية","items":["الروايات الشفوية","الوثائق التاريخية","صور النعيم القديمة","الشخصيات والرواد"]},{"id":"sea","t":"قسم التراث البحري والقلافة","items":["نماذج السفن","أدوات صناعة السفن","تاريخ القلاليف","تاريخ ساحل النعيم"]},{"id":"photo","t":"معرض التصوير الفوتوغرافي","items":["الصور التاريخية","التصوير المعاصر","أرشيف النعيم البصري","المعارض الموسمية"]},{"id":"art","t":"قسم الفنون التشكيلية","items":["معرض دائم","معارض مؤقتة","ورش فنية","دعم الفنانين الشباب"]},{"id":"arch","t":"قسم العمارة والهوية","items":["العمارة التقليدية","تطور عمران النعيم","نماذج وتصاميم معمارية"]},{"id":"craft","t":"قسم الحرف التقليدية","items":["ورش حية","عرض المنتجات","تدريب الشباب"]},{"id":"library","t":"المكتبة ومركز الدراسات","items":["تاريخ النعيم","تاريخ البحرين","التراث البحري","الدراسات والبحوث"]},{"id":"stage","t":"المسرح والساحة الثقافية","items":["الندوات","المحاضرات","الأمسيات","الفعاليات التراثية","المهرجانات والأسواق الشعبية"]}],"card":[{"k":"def","t":"تعريف القسم","q":"ما هو دوره ورسالة وجوده داخل المركز؟"},{"k":"content","t":"المحتوى","q":"ما الذي سيعرض أو يقدم للجمهور؟"},{"k":"items","t":"المقتنيات المطلوبة","q":"ما هي الأدوات والصور والوثائق والنماذج المطلوبة؟"},{"k":"space","t":"المساحة","q":"ما حجم المساحة المناسبة وطبيعة تصميمها؟"},{"k":"equip","t":"التجهيزات","q":"ما الاحتياجات الفنية والتقنية؟"},{"k":"programs","t":"البرامج والفعاليات","q":"ما الأنشطة التي يمكن تنفيذها بصورة مستمرة؟"},{"k":"people","t":"الموارد البشرية","q":"من هم المختصون أو المتطوعون المطلوبون لإدارة القسم؟"},{"k":"partners","t":"الشراكات","q":"ما الجهات والمؤسسات والأفراد الذين يمكن التعاون معهم؟"},{"k":"sustain","t":"الاستدامة","q":"كيف يمكن للقسم أن يستمر ويتطور مستقبلاً؟"},{"k":"priority","t":"الأولويات","q":"ما الذي يجب تنفيذه في المرحلة الأولى، وما الذي يمكن تأجيله؟"}]};

/* ---------- DB helpers ---------- */
function stamp(o){return Object.assign({},o,{updatedAt:Date.now(),updatedBy:uid||null})}
async function save(path,data,isNew){
  if(!db){toast("الحفظ غير متاح في هذا العرض. افتح المنصة وأنت مسجّل الدخول.");return false}
  try{
    if(isNew){await db.collection(path).add(stamp(Object.assign({createdAt:Date.now(),createdBy:uid||null},data)))}
    else{await db.doc(path).set(stamp(data))}
    toast("تم الحفظ");return true;
  }catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;toast("ليست لديك صلاحية التعديل على هذه المنصة. اطلب من مالكها مشاركتها معك بصفة «مساهم».");render()}
    else if(e&&e.code==="quota_exceeded"){toast("امتلأت سعة قاعدة البيانات. احذف بنوداً غير مستخدمة ثم أعد المحاولة.")}
    else toast("تعذّر الحفظ، أعد المحاولة بعد لحظات.");
    return false;
  }
}
async function remove(path){if(!db)return;try{await db.doc(path).delete();toast("تم الحذف")}catch(e){toast("تعذّر الحذف")}}
function sub(col,fn){db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>Object.assign({id:d.id},d.data())));S.loaded[col]=true;render()},()=>{})}

const dlg=$("#dlg");
let dlgRet=null;
dlg.addEventListener("close",()=>{if(!dlgRet)return;const r=dlgRet;dlgRet=null;requestAnimationFrame(()=>window.scrollTo({top:r.y}))});
function openForm({title,fields,value,onSave,onDelete,intro,back}){
  value=value||{};
  if(!dlg.open)dlgRet={y:window.scrollY};
  const goBack=()=>{if(back){back.fn()}else dlg.close()};
  const afterDone=()=>{dlg.close();if(back)setTimeout(back.fn,200)};
  dlg.innerHTML=`<form method="dialog" id="mf"><div class="mhead"><div class="mtitle"><button class="btn sm backbtn" type="button" data-back>→ ${esc(back?back.label:"رجوع")}</button><h3>${esc(title)}</h3></div><button class="btn sm ghost" type="button" data-x aria-label="إغلاق النافذة">إغلاق ✕</button></div>
  <div class="mbody">${intro||""}<div class="form">${fields.map(f=>fieldHTML(f,value[f.k])).join("")}</div></div>
  <div class="mfoot"><div>${onDelete&&canWrite?`<button class="btn danger" type="button" data-del>حذف</button>`:""}</div>
  <div class="r"><button class="btn" type="button" data-back>${back?"→ "+esc(back.label):"إلغاء والرجوع"}</button>${canWrite?`<button class="btn pri" type="submit">حفظ</button>`:""}</div></div></form>`;
  dlg.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>dlg.close());
  dlg.querySelectorAll("[data-back]").forEach(b=>b.onclick=goBack);
  const del=dlg.querySelector("[data-del]");
  if(del)del.onclick=async()=>{if(del.dataset.armed){afterDone();await onDelete()}else{del.dataset.armed=1;del.textContent="تأكيد الحذف"}};
  const fileIn=dlg.querySelector("input[type=file]");
  dlg.querySelector("#mf").onsubmit=async e=>{e.preventDefault();
    const out={};fields.forEach(f=>{if(f.type==="file"||f.type==="html")return;const el=dlg.querySelector("#f_"+f.k);if(el)out[f.k]=el.value.trim()});
    for(const f of fields){if(f.req&&!out[f.k]){toast("الحقل «"+f.label+"» مطلوب");return}}
    if(fileIn&&fileIn.files[0]){
      if(!assets){toast("رفع الملفات متاح للمحررين فقط");}
      else{try{toast("جارٍ رفع الملف…");const r=await assets.upload(fileIn.files[0]);out.assetId=r.id;out.assetUrl=r.url;out.assetType=r.contentType}catch(err){toast("تعذّر رفع الملف: "+(err&&err.message||""));return}}
    }
    const sb=dlg.querySelector("button[type=submit]");sb.disabled=true;
    const ok=await onSave(out);sb.disabled=false;if(ok!==false)afterDone();};
  dlg.showModal();
}
function fieldHTML(f,v){
  const id="f_"+f.k;v=v??f.def??"";
  if(f.type==="html")return f.html;
  let inp;
  if(f.type==="textarea")inp=`<textarea id="${id}" ${canWrite?"":"readonly"} placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
  else if(f.type==="select")inp=`<select id="${id}" ${canWrite?"":"disabled"}>${f.opts.map(([k,t])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  else if(f.type==="file")inp=assets&&canWrite?`<input id="${id}" type="file" accept="image/*,application/pdf,audio/*,video/*">`:`<div class="hint">رفع الملفات متاح لمن يملك صلاحية «محرر» على المنصة.</div>`;
  else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}" ${canWrite?"":"readonly"} placeholder="${esc(f.ph||"")}">`;
  return `<div class="field" ${f.wide===false?"":""}><label for="${id}">${esc(f.label)}${f.req?" *":""}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}

async function fillUpdates(){
  const box=$("#updates");if(!box||!db)return;
  const items=[];
  S.tasks.forEach(t=>t.updatedAt&&items.push({t:t.updatedAt,by:t.updatedBy,txt:"مهمة: "+t.title,st:pill(TASK_ST,t.status),go:"phases"}));
  S.meetings.forEach(t=>t.updatedAt&&items.push({t:t.updatedAt,by:t.updatedBy,txt:"لقاء: "+t.title,st:pill(MEET_ST,t.status),go:"meetings"}));
  S.archive.forEach(t=>t.updatedAt&&items.push({t:t.updatedAt,by:t.updatedBy,txt:(ARC_TYPE[t.type]||"مادة")+": "+t.title,st:pill(ARC_ST,t.status),go:"archive"}));
  S.partners.forEach(t=>t.updatedAt&&items.push({t:t.updatedAt,by:t.updatedBy,txt:"شراكة: "+t.name,st:pill(PART_ST,t.status),go:"partners"}));
  S.decisions.forEach(t=>t.updatedAt&&items.push({t:t.updatedAt,by:t.updatedBy,txt:"قرار: "+t.text,st:pill(DEC_LV,t.level),go:"decisions"}));
  Object.entries(S.people).forEach(([id,v])=>v.updatedAt&&items.push({t:v.updatedAt,by:v.updatedBy,txt:"متابعة: "+((BYID[id]||v).n||""),st:pill(INV_ST,v.invite||"none"),go:"people"}));
  Object.entries(S.depts).forEach(([id,v])=>{const d=BOOK.depts.find(x=>x.id===id);v.updatedAt&&d&&items.push({t:v.updatedAt,by:v.updatedBy,txt:"بطاقة: "+d.t,st:pill(DEPT_ST,v.status||"notstarted"),go:"depts"})});
  items.sort((a,b)=>b.t-a.t);const top=items.slice(0,8);
  if(!top.length)return;
  let ps={};if(user){try{ps=await user.profiles(top.map(i=>i.by).filter(Boolean))}catch(e){}}
  if(!document.body.contains(box))return;
  box.innerHTML=top.map(i=>{const p=i.by&&ps[i.by];return`<div class="row">${p?`<img class="av" src="${esc(p.avatarUrl)}" alt="">`:`<span class="av" style="background:var(--bg2)"></span>`}<div class="main"><b style="font-weight:500">${esc(i.txt)}</b><div class="meta"><span>${p&&p.name?esc(p.name):"عضو في الفريق"}</span><span>${ago(i.t)}</span></div></div><div class="act">${i.st}</div></div>`}).join("");
}

/* ---- Book reader ---- */
function vBook(){
  const ch=BOOK.reader[bookCh];
  let body="",list=null;
  const flush=()=>{if(list){body+=`<${list.t}>${list.items.join("")}</${list.t}>`;list=null}};
  ch.b.forEach(([k,s])=>{
    if(k==="li"||k==="ol"){const t=k==="li"?"ul":"ol";if(!list||list.t!==t){flush();list={t,items:[]}}list.items.push(`<li>${esc(s)}</li>`);return}
    flush();
    if(k==="h")body+=`<h3>${esc(s)}</h3>`;
    else if(k==="lbl")body+=`<p class="lbl">${esc(s)}</p>`;
    else if(k==="table")body+=`<div style="overflow-x:auto"><table><thead><tr><th>المرحلة</th><th>المهمة</th><th>المدة المقترحة</th></tr></thead><tbody>${BOOK.phases.map(p=>`<tr><td>${ORD[p.n-1]}</td><td>${esc(p.t)}</td><td>${esc(p.d)}</td></tr>`).join("")}</tbody></table></div><p class="small muted" style="font-family:var(--f-ui)">ملاحظة: مسميات المهام في الجدول الأصلي مختصرة؛ وُضعت هنا عناوين المراحل كما وردت في الدراسة.</p>`;
    else body+=`<p>${esc(s)}</p>`;
  });flush();

document.addEventListener("click",e=>{const nbk=e.target.closest("[data-navback]");if(nbk){navBack();return}const b=e.target.closest("[data-ch]");if(!b)return;if(+b.dataset.ch!==bookCh)pushHist();bookCh=+b.dataset.ch;try{localStorage.setItem("nhc.ch",bookCh)}catch(x){}render();const pg=document.querySelector(".reader");if(pg)pg.scrollIntoView({block:"start"})});

/* ---- Phases & tasks ---- */
function taskRow(t){
  return `<div class="row ${t.status==="done"?"done":""}"><button class="pill ${TASK_ST[t.status||"todo"][1]}" type="button" ${canWrite?`data-cycle="${esc(t.id)}" title="اضغط لتغيير الحالة"`:"disabled"}>${TASK_ST[t.status||"todo"][0]}</button>
  <div class="main"><b>${esc(t.title)}</b><div class="meta">${t.phase?`<span>المرحلة ${ORD[t.phase-1]}</span>`:""}${t.owner?`<span>المسؤول: ${esc(t.owner)}</span>`:""}${t.due?`<span>الموعد: ${esc(fmtDate(t.due))}</span>`:""}${t.note?`<span>${esc(t.note)}</span>`:""}</div></div>
  <div class="act">${editBtn(`data-task="${esc(t.id)}"`)}</div></div>`;
}
function vPhases(){
  return `<div class="vhead"><div><span class="eyebrow">من الدراسة إلى التنفيذ</span><h2 class="vt">المراحل التسع والمهام</h2><p class="lede">لكل مرحلة ما ورد عنها في الدراسة، ومعها قائمة مهام يحدّثها الفريق. اضغط على حالة المهمة لتنقلها بين «لم تبدأ» و«جارية» و«منجزة».</p></div>${canWrite&&db?`<button class="btn pri" type="button" data-newtask="1">إضافة مهمة</button>`:""}</div>
  ${accessNote()}
  ${BOOK.phases.map(p=>{
    const s=phaseStats(p.n),bk=PHASE_BOOK[p.n],tasks=S.tasks.filter(t=>+t.phase===p.n).sort((a,b)=>(a.order||0)-(b.order||0));
    let book="";
    if(bk.items)book+=`<ul>${bk.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    if(bk.groups)book+=bk.groups.map(g=>`<div class="grp">${esc(g[0])}</div><div>${esc(g[1])}</div>`).join("");
    if(bk.text)book+=`<p style="margin:0">${esc(bk.text)}</p>`;
    if(bk.note)book+=`<p style="margin:6px 0 0">${esc(bk.note)}</p>`;
    if(bk.link)book+=`<p style="margin:8px 0 0"><a href="#${bk.link}" data-go="${bk.link}">الانتقال إلى ${esc(VIEWS.find(v=>v[0]===bk.link)[1])} ←</a></p>`;
    const st=s.t&&s.d===s.t?["مكتملة","ok"]:s.d||s.p?["جارية","warn"]:["لم تبدأ",""];
    return `<details class="phase" id="ph${p.n}" ${p.n<=3?"open":""}><summary><span class="phn">${AR(p.n)}</span><div style="min-width:0"><b style="font-size:16.5px">المرحلة ${ORD[p.n-1]}: ${esc(p.t)}</b><div class="small muted">المدة المقترحة في الدراسة: ${esc(p.d)} · ${s.t?AR(s.d)+" من "+AR(s.t)+" مهام منجزة":"لم تُضف مهام"}</div></div><span class="pill ${st[1]}">${st[0]}</span></summary>
