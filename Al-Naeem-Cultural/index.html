const FEM=/^(الأستاذة|الدكتورة|المهندسة)|حنان|زينب|حوراء|غنية|جميلة/;
function letterData(){const m=S.meta;return{sponsor:m.sponsor||"",date:m.confDate||"",time:m.confTime||"",venue:m.confVenue||"",coord:m.sponsor||""}}
function letterHTML(p,L){
  const fem=FEM.test(p.n);const ph=t=>`<mark>${esc(t)}</mark>`;
  return `<div class="sadu" aria-hidden="true"></div>
  <p class="c">بسم الله الرحمن الرحيم</p>
  <h3>دعوة لحضور المؤتمر التأسيسي لمشروع مركز النعيم الثقافي والتراثي</h3>
  <p>السلام عليكم ورحمة الله وبركاته،،،</p>
  <p><b>${fem?"الأخت الكريمة":"الأخ الكريم"} / ${esc(p.n)} ${fem?"المحترمة":"المحترم"}،،</b></p>
  ${p.bio?`<p>${esc(p.bio)}</p>`:""}
  <p>يسرنا دعوتكم للمشاركة في المؤتمر التأسيسي لمشروع مركز النعيم الثقافي والتراثي، الذي يأتي انطلاقاً من الرغبة في حفظ وتوثيق الموروث التاريخي والثقافي والاجتماعي لمنطقة النعيم، وإبرازه بصورة تليق بتاريخها وإسهامات أهلها في مسيرة البحرين.</p>
  <p>وقد حظيت فكرة المشروع بموافقة ${L.sponsor?esc(L.sponsor):ph("الجهة الراعية")} على تبنيها ورعايتها في مرحلتها التأسيسية، باعتباره المظلة المؤسسية التي يمكن أن تجمع الجهود والخبرات، وتدعم التنسيق بين أصحاب الشأن والاختصاص، وصولاً إلى بلورة مشروع ثقافي وتراثي يقوم على أسس معرفية ومجتمعية واضحة.</p>
  <h4>لماذا ندعوكم؟</h4>
  <p>إن مشروع مركز النعيم الثقافي والتراثي لا يمكن أن يُبنى من تصور فردي أو من خلال جهة واحدة، بل يحتاج إلى مشاركة أصحاب الخبرة والمعرفة، وأبناء المنطقة الذين يحملون في ذاكرتهم تاريخها وتجاربها وموروثها.</p>
  <p>ومن هذا المنطلق، تأتي دعوتكم باعتباركم من أصحاب الشأن أو الخبرة أو الاهتمام الذين يمكن أن يسهموا في إثراء المشروع برؤاهم ومعلوماتهم ومقترحاتهم وعلاقاتهم، والمساعدة في تحديد مكوناته وأولوياته وسبل تطويره.</p>
  ${p.role?`<p>ونتطلع بوجه خاص إلى إسهامكم في: ${esc(p.role.replace(/\.$/,""))}.</p>`:""}
  <h4>أهداف المؤتمر التأسيسي</h4>
  <p>يهدف اللقاء إلى فتح حوار أولي ومنظم حول المشروع، من خلال:</p>
  <ol><li>عرض الفكرة العامة للمركز وأهدافه ورؤيته المستقبلية.</li><li>التعرف على ما تمتلكه المنطقة من ذاكرة ووثائق وصور ومقتنيات وحرف وتجارب وروايات.</li><li>تحديد المحاور الثقافية والتراثية التي يمكن أن يتضمنها المركز.</li><li>الاستماع إلى آراء أصحاب الاختصاص بشأن الاحتياجات الفنية والتقنية والتجهيزية لكل محور.</li><li>بحث البرامج والأنشطة التي يمكن تنفيذها، مثل المعارض والورش والمحاضرات والفعاليات والمبادرات الشبابية.</li><li>تحديد الجهات والأفراد الذين يمكن التعاون معهم في مراحل المشروع المختلفة.</li><li>بحث آليات تشكيل فرق عمل متخصصة تتابع المحاور وتطور التصور التأسيسي للمركز.</li></ol>
  <h4>من فكرة أولية إلى مشروع مؤسسي</h4>
  <p>نؤكد أن هذا المؤتمر لا يأتي لعرض مشروع مكتمل أو طرح تصور نهائي جاهز للاعتماد، وإنما يمثل الخطوة الأولى في مسار تشاوري وتأسيسي نطمح من خلاله إلى جمع المعرفة بالذاكرة، والخبرة بالممارسة، والشباب بأصحاب الاختصاص. فالمقصود ليس إنشاء مبنى ثم البحث عن محتوى له، بل العمل أولاً على تحديد هوية المشروع ومحتواه واحتياجاته، ثم دراسة المكان والبرامج والشراكات والموارد التي تمكنه من أداء رسالته.</p>
  <h4>أهمية حضوركم ومساهمتكم</h4>
  <p>إن حضوركم لا يمثل مشاركة بروتوكولية، بل نأمل أن يكون إسهاماً عملياً في مرحلة التأسيس، من خلال ما تحملونه من خبرات وتجارب وذكريات ومعلومات وعلاقات يمكن أن تساعد في بناء المشروع على أسس راسخة. فكل صورة قد توثق مرحلة، وكل وثيقة قد تحفظ معلومة، وكل رواية قد تنقل جانباً من الذاكرة، وكل حرفة قد تحمل تاريخاً، وكل فكرة قد تفتح مجالاً جديداً أمام المشروع.</p>
  <p>ونرفق لكم الدراسة الأصلية للمشروع، ونرحب بمراجعتها وإبداء ملاحظاتكم عليها، وبكل صورة أو وثيقة أو معلومة يمكن أن تثري محتواه.</p>
  <h4>ختاماً</h4>
  <p>إننا نتطلع إلى أن يكون هذا المؤتمر بداية لشراكة مجتمعية واسعة، تجمع أبناء النعيم وأصحاب الخبرة والمعرفة، وتسهم في تأسيس مشروع يحفظ موروث المنطقة، ويبرز إسهامات أهلها، ويمنح الأجيال القادمة فرصة التعرف على تاريخهم والاعتزاز به والمشاركة في تطويره. وإذ نتشرف بدعوتكم، نرجو تأكيد حضوركم، آملين أن نلتقي بكم للاستفادة من رؤاكم وتوجيهاتكم ومقترحاتكم، والمشاركة معاً في وضع اللبنات الأولى لهذا المشروع.</p>
  <p class="c"><b>فالمشروع يبدأ بفكرة، ويكبر بالمشاركة، ويستمر بالعمل المؤسسي، ويترك أثره حين يصبح إرثاً مشتركاً للأجيال.</b></p>
  <p>وتفضلوا بقبول خالص التقدير والاحترام،،،</p>
  <div class="sign"><span>المعد والمشارك معكم</span><b>عمار أحمد النشابة</b>${L.sponsor?`<span>بالتنسيق مع ${esc(L.sponsor)}</span>`:`<span>بالتنسيق مع ${ph("الجهة الراعية")}</span>`}</div>
  <p style="margin-top:16px"><b>موعد المؤتمر:</b> ${L.date?esc(fmtDate(L.date)):ph("لم يُحدد")}${L.time?" · "+esc(L.time):""}<br><b>المكان:</b> ${L.venue?esc(L.venue):ph("لم يُحدد")}</p>
  <div class="sadu b" aria-hidden="true"></div>`;
}

  if(!db){canWrite=false;render();return}
  db.doc("meta/project").onSnapshot(s=>{S.meta=s.exists?s.data():{};S.loaded.meta=true;render()},()=>{});
  sub("tasks",a=>S.tasks=a);sub("meetings",a=>S.meetings=a);sub("archive",a=>S.archive=a);sub("partners",a=>S.partners=a);sub("decisions",a=>S.decisions=a);
  sub("people",a=>{S.people=Object.fromEntries(a.map(x=>[x.id,x]))});
  sub("depts",a=>{S.depts=Object.fromEntries(a.map(x=>[x.id,x]))});
  sub("zones",a=>{S.zones=Object.fromEntries(a.map(x=>[x.id,x]))});
  ZONES.forEach(z=>sub(`zones/${z.id}/members`,a=>{S.zmem[z.id]=a}));
  render();
})();
</script>
